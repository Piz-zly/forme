/* ===== CHERCHER : aliments de base sans code-barres =====
   Premier onglet de la feuille « Ajouter » du Repas. Cherche dans FOODS (js2e.js,
   généré : noms familiers, unités usuelles) puis dans la table Ciqual (CIQUAL, js2g.js,
   généré : grammes seulement) sans tenir compte des accents ni des majuscules, puis demande la quantité
   (grammes, ou une unité usuelle : œuf, tranche, càs…) avec le calcul en direct. */
/* Sections : les memes que la bibliotheque du Scan (SLIB, js4b.js). Chaque aliment a une categorie « section.sous-section ». */
const foodCats=()=>[['top','Courants']].concat(SLIB.filter(c=>FOODS.some(f=>f.cat.split('.')[0]===c.id)).map(c=>[c.id,c.s]));
const normTxt=s=>String(s??'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'\-]/g,' ');
/* ---- fautes de frappe : Fuse.js (vendor/fuse.basic.min.js, Apache-2.0) ----
   Toutes les recherches de l'appli cherchent d'abord exactement (mots dans n'importe quel ordre,
   sans accents, pluriel retiré). Seul un mot tapé qui ne se trouve NULLE PART dans la liste est
   complété par les mots les plus proches de son vocabulaire (« nateur » → « nature »). Une recherche
   sans faute ne change donc pas, et ce qui est trouvé exactement passe devant ce qui est corrigé.
   Chaque liste a son vocabulaire (mots distincts + index Fuse), fait une fois et refait seulement
   si la liste change (fzCache). Sans Fuse (fichier absent), on garde la recherche exacte. */
const FZ_T=0.34;          /* tolérance Fuse : 0 = exact, 1 = tout ; réglée avec tests/t14.py */
const fzWords=q=>normTxt(q).split(/\s+/).filter(Boolean).map(w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w);
function fzVocab(keys){
  const all='\n'+keys.join('\n'),words=[...new Set(all.split(/\s+/).filter(w=>w.length>2))];
  return {all,fuse:typeof Fuse==='function'?new Fuse(words,{includeScore:true,threshold:FZ_T,ignoreLocation:true}):null};
}
/* nombre de fautes entre deux mots (lettre en trop, en moins, changée, ou deux lettres inversées) */
function fzDist(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function fzCache(o,sig,keys){if(!o.v||o.sig!==sig){o.v=fzVocab(keys());o.sig=sig}return o.v}
/* chaque mot tapé → [le mot, puis jusqu'à 3 corrections, de la plus proche à la moins proche].
   Fuse propose des mots voisins ; on ne garde que ceux à 1 faute (mot de 4-5 lettres) ou 2 fautes
   (6 lettres et plus, première lettre juste) : « nateur » → « nature », jamais « voiture » → « friture ». */
function fzAlts(q,voc){
  return fzWords(q).map(w=>{
    if(w.length<4||!voc.fuse||voc.all.includes(w))return [w];
    const max=w.length<6?1:2;
    const r=voc.fuse.search(w,{limit:20}).map(x=>({w:x.item,d:fzDist(w,x.item),s:x.score})).filter(x=>x.d<=max&&(x.d<2||x.w[0]===w[0])).sort((a,b)=>a.d-b.d||a.s-b.s);
    return [w].concat(r.slice(0,3).map(x=>x.w));
  });
}
/* où le mot (ou une correction) se trouve dans key : [position, 0 si exact sinon rang de la correction] */
function fzFind(key,alts){for(let j=0;j<alts.length;j++){const i=key.indexOf(alts[j]);if(i>=0)return [i,j]}return null}
/* toute la requête : null si un mot manque, sinon une note (0 = tout exact ; plus c'est corrigé, plus c'est haut) */
function fzScore(key,t){let s=0;for(const a of t){const m=fzFind(key,a);if(!m)return null;if(m[1])s+=2+m[1]}return s}

/* Ciqual : mêmes objets que FOODS, marqués cq. Cherchés, mais pas listés par section (des centaines). */
const CQFOODS=CIQUAL.map(([id,cat,n,k,p,c,f,ml])=>({id:'cq'+id,cat,n,k,p,c,f,ml,cq:1}));
const ALLFOODS=FOODS.concat(CQFOODS);
ALLFOODS.forEach(f=>{f._k=normTxt(f.n+' '+(f.a||''));f._nl=normTxt(f.n).length});
const FOODVOC={},foodVoc=()=>fzCache(FOODVOC,ALLFOODS.length,()=>ALLFOODS.map(f=>f._k));
setTimeout(foodVoc,1500);   /* vocabulaire prêt avant la première recherche, sans retarder l'ouverture */
let bq='',bcat='top',bSel=null,bUnit=-1,bQty=100,bSlot='bk';   /* bUnit : -1 = grammes (ou ml), sinon rang dans f.u */

/* ---- recherche ---- */
function foodSearch(q){
  /* tous les mots doivent se trouver ; « oeufs » trouve « œuf » (pluriel retiré) ; fautes : fzAlts */
  const t=fzAlts(q,foodVoc());
  if(!t.length)return[];
  const res=[];
  for(const f of ALLFOODS){
    let sc=0,ok=true;
    for(const a of t){
      const m=fzFind(f._k,a);
      if(!m){ok=false;break}
      const i=m[0];
      sc+=(i===0?0:f._k[i-1]===' '?1:3)+(m[1]?4+m[1]+(i>=f._nl?1:0):0);   /* début du nom, début d'un mot, ailleurs ; mot corrigé après (et dans le nom avant les mots-clés) */
    }
    if(ok)res.push({f,sc:sc-(f.top?.5:0)+(f.cq?1.5:0)});   /* les aliments familiers passent devant Ciqual */
  }
  return res.sort((a,b)=>a.sc-b.sc||a.f.n.length-b.f.n.length).slice(0,50).map(x=>x.f);
}
function foodList(){
  if(bq.trim())return foodSearch(bq);
  if(bcat==='top')return FOODS.filter(f=>f.top).sort((a,b)=>a.top-b.top);
  return FOODS.filter(f=>f.cat.split('.')[0]===bcat).sort((a,b)=>a.n.localeCompare(b.n,'fr'));
}
function foodRow(f){
  return `<button class="li" data-act="b-pick" data-id="${f.id}"><div class="grow"><div class="t">${esc(f.n)}</div><div class="small muted">P ${nf(f.p)} · G ${nf(f.c)} · L ${nf(f.f)} · pour 100 ${f.ml?'ml':'g'}${f.cq?' · Ciqual':''}</div></div><div style="text-align:right;flex:none"><b class="num" style="font-size:18px">${nf(f.k,0)}</b><div class="small muted">kcal</div></div></button>`;
}
function foodRows(){
  const list=foodList();
  if(!list.length)return '<div class="empty">Aucun aliment trouvé.<br>Ajoute-le à la main dans l’onglet « Manuel ».</div>';
  if(!bq.trim()&&bcat!=='top'){   /* une section : les aliments par sous-section */
    const sec=SLIB.find(c=>c.id===bcat);
    return (sec?sec.subs:[]).map(([k,n])=>{
      const l=list.filter(f=>f.cat===bcat+'.'+k);
      return l.length?`<div class="sec libsub">${esc(n)} <span class="muted">· ${l.length}</span></div><div class="list">${l.map(foodRow).join('')}</div>`:'';
    }).join('')+cqMore(bcat);
  }
  return '<div class="list">'+list.map(foodRow).join('')+'</div>';
}
function cqMore(sec){
  const n=CQFOODS.filter(f=>f.cat.split('.')[0]===sec).length;
  return n?`<div class="small muted" id="bcqmore" style="margin-top:10px">+ ${n} aliments de la table Ciqual dans cette section : tape un mot pour les trouver.</div>`:'';
}
function foodSearchHtml(slot){
  const chips=foodCats().map(([k,n])=>`<button class="chip" data-act="b-cat" data-k="${k}" aria-pressed="${!bq.trim()&&bcat===k}">${n}</button>`).join('');
  return `<div class="field"><input class="inp" type="search" id="bqin" data-in="bq" placeholder="Ex : œuf, riz, poulet…" value="${esc(bq)}" aria-label="Chercher un aliment" autocomplete="off"></div>
  <div id="boften">${bq.trim()?'':oftenHtml(slot)}</div>
  <div class="chips" id="bchips">${chips}</div>
  <div id="bres">${foodRows()}</div>
  <div class="small muted" style="margin-top:12px">Valeurs moyennes pour 100 g, indicatives. Plus de ${Math.floor(ALLFOODS.length/100)*100} aliments, dont la table Ciqual (Anses). Pour un produit de marque, utilise « Scanner ».</div>`;
}
/* Met à jour la liste et les puces sans refaire la feuille (le clavier reste ouvert). */
function foodRefresh(){
  const q=bq.trim();
  document.querySelectorAll('#bchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(!q&&c.dataset.k===bcat)));
  const r=$('#bres');if(r)r.innerHTML=foodRows();
  const o=$('#boften');if(o)o.innerHTML=q?'':oftenHtml(bSlot);   /* « souvent à ce repas » masqué pendant une recherche */
  const i=$('#bqin');if(i&&i.value!==bq)i.value=bq;
}
I.bq=t=>{bq=t.value;foodRefresh()};
A['b-cat']=b=>{bcat=b.dataset.k;bq='';foodRefresh()};

/* ---- quantité ---- */
const bBase=f=>f.ml?'ml':'g';
const bGrams=()=>bUnit<0?bQty:bQty*bSel.u[bUnit][1];
const bFmt=q=>Math.abs(q*4-Math.round(q*4))<1e-9?frac(q):nf(q,2);
/* Texte écrit dans le journal : « 2 œufs », « 150 g de riz basmati cuit », « 1 càs d’huile d’olive ». */
function bLabel(){
  const f=bSel,low=f.n.charAt(0).toLowerCase()+f.n.slice(1);
  if(bUnit<0)return nf(bQty,2)+' '+bBase(f)+' '+rcDe(low);
  const [lab,,self]=f.u[bUnit],q=bFmt(bQty)+' '+rcPl(lab,bQty);
  return self?q:q+' '+rcDe(low);
}
function bQuick(){
  const v=bUnit<0?(bSel.ml?[100,200,250,330]:[50,100,150,200,250]):[.5,1,2,3,4];
  return v.map(x=>`<button class="chip" data-act="b-q" data-v="${x}" aria-pressed="${bQty===x}">${bUnit<0?x:frac(x)}</button>`).join('');
}
function foodQtyHtml(){

  ${units.length>1?`<div class="seg rcslotseg" id="bunits" role="tablist" aria-label="Unité">${units.map(([i,n])=>`<button role="tab" data-act="b-unit" data-i="${i}" aria-selected="${bUnit===i}">${esc(n)}</button>`).join('')}</div>`:''}
  <div class="field"><label for="bqty">Quantité (<span id="bu">${esc(bUnit<0?bBase(f):f.u[bUnit][0].split('|')[1]||f.u[bUnit][0])}</span>)</label><input class="inp" id="bqty" data-in="bqty" inputmode="decimal" value="${String(bQty).replace('.',',')}"></div>
  <div class="chips" id="bquick">${bQuick()}</div>
  <div class="stats" id="bmac" style="grid-template-columns:repeat(4,1fr)"></div>
  <div class="small muted" id="bgrams" style="margin:8px 0 12px;min-height:18px"></div>
  <label class="row" style="margin:0 0 14px;min-height:44px"><input type="checkbox" id="bfav" style="width:22px;height:22px"> Garder dans mes favoris</label>
  <button class="btn block" id="badd" data-act="b-add"></button>`;
}
function bDraw(typing){
  const f=bSel;if(!f||!$('#bmac'))return;
  const g=bGrams(),m=x=>x*g/100;
  $('#bmac').innerHTML=[['kcal',m(f.k),0],['prot. (g)',m(f.p),1],['gluc. (g)',m(f.c),1],['lip. (g)',m(f.f),1]].map(([l,v,d])=>`<div class="stat"><b class="num">${nf(v,d)}</b><span>${l}</span></div>`).join('');
  $('#bgrams').textContent=bUnit<0?'':'= '+nf(g,0)+' '+bBase(f);
  const a=$('#badd');a.textContent='Ajouter · '+nf(m(f.k),0)+' kcal';a.disabled=!(bQty>0);
  document.querySelectorAll('#bunits button').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.i)===bUnit)));
  $('#bquick').innerHTML=bQuick();
  $('#bu').textContent=bUnit<0?bBase(f):f.u[bUnit][0].split('|')[1]||f.u[bUnit][0];
  if(!typing)$('#bqty').value=String(bQty).replace('.',',');
}
A['b-pick']=b=>{
  const f=ALLFOODS.find(x=>x.id===b.dataset.id);if(!f)return;
  bSel=f;
  if(f.u&&f.u.length){bUnit=0;bQty=1}else{bUnit=-1;bQty=f.ml?200:100}
  addSheet(bSlot);bDraw();
};
A['b-back']=()=>{bSel=null;addSheet(bSlot)};
A['b-unit']=b=>{
  /* on garde la même quantité en grammes : 2 œufs deviennent 110 g */
  const g=bGrams(),i=Number(b.dataset.i);bUnit=i;
  bQty=i<0?Math.round(g):Math.max(.25,Math.round(g/bSel.u[i][1]*4)/4);
  bDraw();
};
A['b-q']=b=>{bQty=Number(b.dataset.v);bDraw()};

/* cru / cuit : l'aliment jumeau, même nom avec l'autre mot (cru ↔ cuit, accordé) */
const TWIN={cru:'cuit',crue:'cuite',crus:'cuits',crues:'cuites',cuit:'cru',cuite:'crue',cuits:'crus',cuites:'crues'};
const twWords=n=>normTxt(n).replace(/[(),]/g,' ').split(/\s+/).filter(Boolean);
function cookTwin(f){
  if(!f||/^jambon/i.test(f.n))return null;   /* jambon cru et jambon cuit sont deux produits différents */
  const w=twWords(f.n);if(!w.some(x=>TWIN[x]))return null;
  const key=w.map(x=>TWIN[x]||x).join(' '),c=ALLFOODS.filter(g=>g!==f&&twWords(g.n).join(' ')===key);
  return c.find(g=>!!g.cq===!!f.cq)||c[0]||null;
}

/* ---------- 4. recettes : lire un ingrédient, calculer les valeurs ---------- */
/* « 150 g de poulet », « 2 œufs », « 1 càs d’huile d’olive », « ½ verre de lait » -> {q, u, n}
   u : 'g', 'ml', '' (à l'unité) ou une unité usuelle (càs, càc, tranche, verre…) */
const ING_UNITS=[['kg','g',1000],['kilo','g',1000],['kilos','g',1000],['g','g',1],['gr','g',1],['gramme','g',1],['grammes','g',1],['mg','g',.001],
  ['ml','ml',1],['cl','ml',10],['l','ml',1000],['litre','ml',1000],['litres','ml',1000],
  ['cas','càs'],['c a s','càs'],['cs','càs'],['cuillere a soupe','càs'],['cuilleres a soupe','càs'],
  ['cac','càc'],['c a c','càc'],['cc','càc'],['cuillere a cafe','càc'],['cuilleres a cafe','càc'],
  ['pincee','pincée'],['pincees','pincée'],['tranche','tranche'],['tranches','tranche'],['verre','verre'],['verres','verre'],['bol','bol'],['bols','bol'],
  ['sachet','sachet'],['sachets','sachet'],['boite','boîte'],['boites','boîte'],['dose','dose'],['doses','dose'],['gousse','gousse'],['gousses','gousse'],
  ['poignee','poignée'],['poignees','poignée'],['pot','pot'],['pots','pot'],['brique','brique'],['briques','brique']];
const ING_UNIT=new Map(ING_UNITS.map(([k,u,m])=>[k,[u,m||0]]));
const ING_G={'càs':15,'càc':5,'pincée':1,'verre':200,'bol':250,'tranche':30,'gousse':5,'poignée':30,'dose':30};
function parseIng(line){
  const s=String(line||'').trim().replace(/^[-•*·]\s*/,'');if(!s)return null;
  const fr={'½':.5,'¼':.25,'¾':.75};
  const m=s.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾])?\s*(.*)$/);
  let q=1,hasQ=false;
  if(m[1]){hasQ=true;const x=m[1];q=fr[x]!=null?fr[x]:x.includes('/')?(num(x.split('/')[0])/num(x.split('/')[1])||1):num(x)}
  let rest=m[2].replace(/^[½¼¾]/,y=>{q=(hasQ?q:0)+fr[y];hasQ=true;return ''}).trim(),u='',mult=0;
  const tok=rest.split(/\s+/);
  for(const n of [3,2,1]){
    if(tok.length<n)continue;
    const k=normTxt(tok.slice(0,n).join(' ')).replace(/\./g,' ').replace(/\s+/g,' ').trim(),hit=ING_UNIT.get(k)||ING_UNIT.get(k.replace(/\s/g,''));
    if(hit&&(n<tok.length||hit[0]==='g'||hit[0]==='ml')){[u,mult]=hit;tok.splice(0,n);break}
  }
  const name=tok.join(' ').replace(/^(de la|des|du|de)\s+/i,'').replace(/^(de l|d)[’']\s*/i,'').trim();
  if(!name)return null;
  if(u==='g'||u==='ml')q*=mult;
  return {q,u,n:name,hasQ};
}
const ingFoodCache=new Map();
/* l'aliment le plus proche dans la base : on enlève des mots à la fin tant que rien n'est trouvé ;
   la version crue est préférée quand le texte ne dit pas « cuit » (poids crus dans les recettes) */
function ingFood(name){
  const k=normTxt(name);if(ingFoodCache.has(k))return ingFoodCache.get(k);
  const w=k.replace(/[()]/g,' ').split(/\s+/).filter(Boolean);let f=null;
  while(w.length&&!f){f=foodSearch(w.join(' '))[0]||null;if(!f)w.pop()}
  if(f&&/\bcuit/.test(normTxt(f.n))&&!/\bcuit/.test(k)){const tw=cookTwin(f);if(tw)f=tw}
  ingFoodCache.set(k,f);return f;
}
/* grammes d'une ligne lue, ou null si on ne sait pas */
function ingGrams(x,f){
  if(!x)return null;
  if(x.u==='g'||x.u==='ml')return x.q;
  if(f&&f.u&&f.u.length){
    const want=normTxt(x.u);
    const u=x.u?f.u.find(v=>v[0].split('|').some(l=>{const n=normTxt(l);return n===want||n.startsWith(want+' ')})):(f.u.find(v=>v[2])||f.u[0]);
    if(u)return x.q*u[1];
  }
  return ING_G[x.u]!=null?x.q*ING_G[x.u]:null;
}
A['rc-calc']=()=>{
  const lines=$('#rfi').value.split('\n').map(x=>x.trim()).filter(Boolean),por=Math.max(1,num($('#rfpor').value)||1);
  if(!lines.length){toast('Écris d’abord les ingrédients, un par ligne');return}
  const t={k:0,p:0,c:0,f:0},ok=[],ko=[];
  for(const l of lines){
    const x=parseIng(l),f=x&&ingFood(x.n),g=f?ingGrams(x,f):null;
    if(!f||g==null){ko.push(l);continue}
    ['k','p','c','f'].forEach(m=>t[m]+=f[m]*g/100);ok.push(l+' → '+f.n+' ('+nf(g,0)+' '+(f.ml?'ml':'g')+')');
  }
  if(!ok.length){$('#rfcalc').innerHTML='<div class="pill warn" style="white-space:normal">Aucun ingrédient reconnu. Écris par exemple « 150 g de poulet » ou « 2 œufs ».</div>';return}
  $('#rfk').value=nf(t.k/por,0);$('#rfp').value=nf(t.p/por,1);$('#rfc').value=nf(t.c/por,1);$('#rff').value=nf(t.f/por,1);

  <ul class="small muted" style="margin:0 0 4px;padding-left:18px">${ok.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>${ko.length?'<div class="small" style="color:var(--warn)">Non compté : '+esc(ko.join(' · '))+'</div>':''}`;
};

/* ingrédients d'une recette, sous une même forme {q, u, n} (n peut porter le pluriel : « œuf|œufs ») */
function recIngs(r){
  if(r.ing)return r.ing.map(([q,u,n])=>({q:num(q),u:u?u.split('|')[0]:'',n,uu:u}));
  return (r.ingTxt||[]).map(parseIng).filter(Boolean).map(x=>({q:x.q,u:x.u,n:x.n,uu:x.u}));
}
const ingKey=n=>fzWords(String(n).split('|')[0]).join(' ');
const ingLabel=n=>{const s=String(n).split('|')[0];return s.charAt(0).toUpperCase()+s.slice(1)};
/* rayon d'un ingrédient : la section de la bibliothèque (SLIB) de l'aliment le plus proche */
const secCache=new Map();
function ingSec(n){
  const k=ingKey(n);if(secCache.has(k))return secCache.get(k);
  const f=ingFood(String(n).split('|')[0]),s=f?f.cat.split('.')[0]:'zz';secCache.set(k,s);return s;
}

/* liste de courses : ingrédients des recettes prévues (pas encore notées) + ajouts, additionnés, par rayon */
function shopItems(){
  const P=PL(),acc=new Map();
  const add=(x,src)=>{
    const u=x.u||'',k=ingKey(x.n)+'|'+u;
    const o=acc.get(k)||{k,n:x.n,u,uu:x.uu||u,q:0,src:new Set(),ex:[]};
    o.q+=num(x.q);if(src)o.src.add(src);acc.set(k,o);return o;
  };
  for(const d of planDays()){const pd=planDay(d);for(const s in pd)for(const it of pd[s]){if(it.ok)continue;const r=recipeById(it.r);if(r)recIngs(r).forEach(x=>add(x,r.n))}}
  for(const e of P.shop.extra){
    if(e.t){acc.set('x:'+e.id,{k:'x:'+e.id,n:e.t,u:'',q:0,free:1,src:new Set(),ex:[e.id]});continue}
    add(e,null).ex.push(e.id);
  }
  return [...acc.values()].map(o=>Object.assign(o,{sec:o.free?ingSec(o.n.replace(/^[\d.,\s]+/,'')):ingSec(o.n)}));
}
function shopQty(o){
  if(o.free||!o.q)return '';
  if(o.u==='g')return o.q>=1000?nf(o.q/1000,2)+' kg':nf(Math.round(o.q),0)+' g';
  if(o.u==='ml')return o.q>=1000?nf(o.q/1000,2)+' l':nf(Math.round(o.q),0)+' ml';
  if(!o.u)return frac(o.q);
  return frac(o.q)+' '+rcPl(o.uu||o.u,o.q);
}

/* ---------- 5. bilan : 7 jours, série, calendrier du mois ---------- */
/* série de jours notés, qui pardonne : un jour sans rien est pardonné s'il n'y a pas eu d'autre jour
   sans rien dans les 7 jours précédents ; aujourd'hui pas encore noté ne casse pas la série */
function mealStreak(){
  const has=d=>dayEntries(d).length>0,days=Object.keys(S.meals).filter(has).sort();
  if(!days.length)return {n:0,fg:0};
  const first=days[0];let d=today(),n=0,fg=0;
  if(!has(d))d=addDays(d,-1);
  while(d>=first){
    if(has(d))n++;
    else{
      let other=false;
      for(let i=1;i<=7;i++){const x=addDays(d,-i);if(x<first)break;if(!has(x)){other=true;break}}
      if(other)break;fg++;
    }
    d=addDays(d,-1);
  }
  return {n,fg};
}
/* couleur d'un jour selon l'objectif : 60–110 % vert, jusqu'à 125 % orange, au-delà rouge, moins de 60 % gris */
function dayBand(d){
  const es=dayEntries(d);if(!es.length)return '';
  const pct=kcalOf(es)/Math.max(1,goals().kcal);
  return pct<.6?'blo':pct<=1.1?'bok':pct<=1.25?'bwarn':'bbad';
}
let blMonth=today().slice(0,7);

  const g=goals(),days=Array.from({length:7},(_,i)=>addDays(today(),i-6)),st=mealStreak();

  const noted=days.filter(d=>dayEntries(d).length),avg=m=>noted.length?noted.reduce((t,d)=>t+totals(dayEntries(d))[m],0)/noted.length:0;
  const [y,mo]=blMonth.split('-').map(Number),first=blMonth+'-01',nDays=new Date(Date.UTC(y,mo,0)).getUTCDate(),lead=(parseD(first).getDay()+6)%7;
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let i=1;i<=nDays;i++){
    const d=blMonth+'-'+pad(i),fut=d>today(),k=kcalOf(dayEntries(d)),band=fut?'':dayBand(d);
    cells+=`<button class="calday ${band}${d===today()?' today':''}" data-act="bl-day" data-d="${d}" ${fut?'disabled':''} aria-label="${esc(fmtLong(d))}${k?' : '+nf(k,0)+' kcal, '+Math.round(k/Math.max(1,g.kcal)*100)+' % de l’objectif':' : rien de noté'}">${i}</button>`;
  }
  const mName=parseD(first).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return `<div class="card" id="blstreak"><h2>Ta série</h2><div style="font:800 22px/1.2 var(--font-display)">${st.n?'🔥 '+st.n+' jour'+(st.n>1?'s':'')+' noté'+(st.n>1?'s':'')+' de suite':'Pas encore de série'}</div>
    <div class="small muted" style="margin-top:6px">${st.fg?st.fg+' jour'+(st.fg>1?'s':'')+' sans rien de noté pardonné'+(st.fg>1?'s':'')+'. ':''}Un oubli est pardonné s’il n’y en a pas eu d’autre dans la semaine d’avant. Aujourd’hui compte dès que tu notes quelque chose.</div></div>
  <div class="card"><h2>7 derniers jours</h2><div class="wkbars" role="img" aria-label="Calories des 7 derniers jours">${bars}</div>
    <div class="small muted" style="margin-top:8px">Trait : ton objectif de ${nf(g.kcal,0)} kcal.</div>
    <div class="stats" id="blavg" style="grid-template-columns:repeat(4,1fr);margin-top:12px"><div class="stat"><b class="num">${nf(avg('kcal'),0)}</b><span>kcal / jour</span></div><div class="stat"><b class="num">${nf(avg('p'),0)}</b><span>prot. (g)</span></div><div class="stat"><b class="num">${nf(avg('c'),0)}</b><span>gluc. (g)</span></div><div class="stat"><b class="num">${nf(avg('f'),0)}</b><span>lip. (g)</span></div></div>

  <div class="card"><div class="row sb" style="margin-bottom:10px"><button class="iconbtn" data-act="bl-mon" data-n="-1" aria-label="Mois précédent">${ICON.chevL}</button><h2 style="margin:0">${esc(mName)}</h2><button class="iconbtn" data-act="bl-mon" data-n="1" aria-label="Mois suivant" ${blMonth>=today().slice(0,7)?'disabled style="opacity:.35"':''}>${ICON.chev}</button></div>

}

n pliant les coudes et en penchant légèrement le buste en avant, jusqu'à ce que tes bras forment un angle droit.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."]},"Tractions":{"eq":"Poids du corps","m":["Grand dorsal"],"s":["Biceps","Milieu du dos"],"st":["Suspends-toi à une barre de traction, les paumes tournées vers l'extérieur et les bras complètement étendus.","Gaine ta sangle abdominale et resserre tes omoplates.","Tire ton corps vers le haut en direction de la barre en fléchissant tes coudes et en amenant ta poitrine vers la barre.","Marque une pause en haut du mouvement, puis abaisse lentement ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Tractions supination":{"eq":"Poids du corps","m":["Grand dorsal"],"s":["Biceps","Avant-bras","Milieu du dos"],"st":["Suspends-toi à une barre de traction, les paumes tournées vers toi et les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et tire ton corps vers la barre, en menant avec ta poitrine.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Tirage vertical":{"eq":"Poulie","m":["Grand dorsal"],"s":["Biceps","Milieu du dos","Épaules"],"st":["Assieds-toi sur la machine de tirage vertical, les genoux placés sous les coussinets.","Saisis la barre de la poulie avec une prise en pronation, un peu plus large que la largeur des épaules.","Penche-toi légèrement en arrière et garde la poitrine ouverte, en maintenant une légère cambrure dans le bas du dos.","Tire la barre vers le haut de ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Tirage vertical prise serrée":{"eq":"Poulie","m":["Grand dorsal"],"s":["Biceps","Milieu du dos","Épaules"],"st":["Fixe une barre à la poulie haute et assieds-toi, les cuisses bloquées sous les coussins.","Saisis la barre, les paumes vers l'avant, les mains plus serrées que la largeur des épaules.","Penche légèrement le buste en arrière, la poitrine sortie.","Tire la barre jusqu'en haut de ta poitrine en ramenant les coudes vers le bas et en serrant les omoplates.","Remonte lentement jusqu'à avoir les bras tendus.","Répète le nombre de répétitions souhaité."]},"Rowing barre":{"eq":"Barre","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Tire la barre vers le bas de ta poitrine en rétractant tes omoplates et en contractant les muscles de ton dos.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Rowing haltère":{"eq":"Haltères","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère d'une main, paume tournée vers ton corps.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et ta sangle abdominale gainée.","Laisse l'haltère pendre droit vers le bas en direction du sol, le bras entièrement tendu.","Tire l'haltère vers le haut en direction de ta poitrine, en gardant ton coude près de ton corps et en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement l'haltère pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."]},"Tirage horizontal":{"eq":"Poulie","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Assieds-toi sur la machine de tirage horizontal, les pieds à plat sur les repose-pieds et les genoux légèrement fléchis.","Saisis la poignée en V à deux mains, les paumes face à face, en gardant le dos droit et les épaules relâchées.","Tire les poignées vers ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet du mouvement, puis relâche lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Rowing T-bar":{"eq":"Barre","m":["Milieu du dos"],"s":["Biceps","Grand dorsal"],"st":["Bloque une extrémité de la barre dans un coin ou dans le support prévu, et charge l'autre extrémité.","Place-toi au-dessus de la barre, un pied de chaque côté, et glisse une poignée en V sous la barre, près des disques.","Fléchis les genoux et penche le buste en avant, le dos droit, les bras tendus.","Tire la barre vers ta poitrine en serrant les omoplates, les coudes près du corps.","Marque un temps, puis redescends lentement.","Répète le nombre de répétitions souhaité."]},"Soulevé de terre":{"eq":"Barre","m":["Lombaires"],"s":["Ischio-jambiers","Fessiers","Mollets","Avant-bras"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et la barre au sol devant toi.","Fléchis les genoux et bascule au niveau des hanches pour abaisser ton torse et saisir la barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Garde le dos droit et la poitrine relevée pendant que tu pousses sur tes talons pour soulever la barre du sol, en étendant tes hanches et tes genoux.","En te redressant, contracte tes fessiers et garde ta sangle abdominale gainée.","Abaisse la barre jusqu'au sol en fléchissant les hanches et les genoux, en gardant ton dos droit.","Répète le nombre de répétitions souhaité."]},"Pull-over poulie":{"eq":"Poulie","m":["Grand dorsal"],"s":[],"st":["Fixe une barre droite à la poulie haute.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, en gardant tes bras tendus et tes paumes tournées vers le bas.","Contracte tes grands dorsaux et tire la barre vers le bas jusqu'à tes cuisses, en gardant les bras tendus pendant tout le mouvement.","Marque une pause en bas, puis ramène lentement la barre à la position de départ.","Répète le nombre de répétitions souhaité."]},"Shrugs haltères":{"eq":"Haltères","m":["Trapèzes"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans chaque main, paumes tournées vers ton corps.","Garde tes bras tendus et laisse les haltères pendre le long de tes flancs.","Lève tes épaules aussi haut que possible, comme si tu essayais de toucher tes oreilles avec tes épaules.","Maintiens la contraction une seconde, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Développé militaire":{"eq":"Barre","m":["Épaules"],"s":["Triceps"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre en prise pronation, légèrement plus large que la largeur des épaules.","Soulève la barre à hauteur des épaules, en gardant tes coudes légèrement devant la barre.","Développe la barre au-dessus de ta tête, en tendant complètement tes bras.","Abaisse la barre à hauteur des épaules et répète pour le nombre de répétitions souhaité."]},"Développé haltères assis":{"eq":"Haltères","m":["Épaules"],"s":["Triceps"],"st":["Assieds-toi sur un banc avec un haltère dans chaque main, posés sur tes cuisses.","Lève les haltères à hauteur des épaules, paumes tournées vers l'avant.","Pousse les haltères vers le haut jusqu'à ce que tes bras soient complètement tendus au-dessus de ta tête.","Marque une pause en haut, puis abaisse lentement les haltères à hauteur des épaules.","Répète le nombre de répétitions souhaité."]},"Arnold press":{"eq":"Haltères","m":["Épaules"],"s":["Triceps"],"st":["Assieds-toi sur un banc avec dossier et tiens un haltère dans chaque main à hauteur d'épaule, paumes tournées vers ton corps et coudes fléchis.","Pousse les haltères vers le haut jusqu'à ce que tes bras soient complètement tendus et tes paumes tournées vers l'avant.","Tourne tes poignets pendant que tu soulèves, de sorte que tes paumes soient tournées vers l'avant en haut du mouvement.","Marque une pause en haut, puis abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Élévations latérales":{"eq":"Haltères","m":["Épaules"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans chaque main, paumes tournées vers ton corps.","Garde le dos droit et gaine ta sangle abdominale.","Lève tes bras sur les côtés jusqu'à ce qu'ils soient parallèles au sol, en gardant une légère flexion dans tes coudes.","Marque une pause en haut, puis abaisse lentement tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Élévations frontales":{"eq":"Haltères","m":["Épaules"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main, paumes tournées vers tes cuisses.","En gardant les bras tendus, expire et lève les haltères devant toi jusqu'à ce qu'ils soient à hauteur d'épaule.","Marque une pause en haut, puis inspire et abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Oiseau":{"eq":"Haltères","m":["Épaules"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans chaque main.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Étends les bras droit vers le bas devant toi, les paumes tournées l'une vers l'autre.","En gardant une légère flexion des coudes, lève les bras sur les côtés jusqu'à ce qu'ils soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Face pull":{"eq":"Poulie","m":["Épaules"],"s":["Milieu du dos"],"st":["Règle la poulie à hauteur du visage, ou un peu plus haut, et fixe la corde.","Saisis la corde à deux mains, les paumes tournées l'une vers l'autre, et recule d'un pas pour mettre la poulie en tension.","Tire la corde vers ton visage en écartant les mains, les coudes hauts, à hauteur des épaules.","En fin de mouvement, serre les omoplates : tes mains arrivent de chaque côté de ta tête.","Reviens lentement, bras tendus, sans laisser la charge t'emporter.","Répète le nombre de répétitions souhaité."]},"Curl barre":{"eq":"Barre","m":["Biceps"],"s":["Avant-bras"],"st":["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre en prise supination, les paumes tournées vers l'avant.","Garde tes coudes près de ton torse et expire pendant que tu enroules les poids en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire pendant que tu commences lentement à abaisser la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Curl haltères":{"eq":"Haltères","m":["Biceps"],"s":["Avant-bras"],"st":["Tiens-toi bien droit avec un haltère dans chaque main, les paumes tournées vers l'avant et les bras complètement tendus.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever les poids jusqu'à ce que tes biceps soient complètement contractés et que les haltères soient à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser les haltères jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Curl marteau":{"eq":"Haltères","m":["Biceps"],"s":["Avant-bras"],"st":["Tiens-toi debout, un haltère dans chaque main, les bras le long du corps, les paumes tournées vers ton corps.","Garde les coudes collés au buste et le haut des bras immobile.","Expire et monte les haltères vers tes épaules sans tourner les poignets : les paumes restent face à face.","Marque un temps en haut en contractant les biceps.","Inspire et redescends lentement.","Répète le nombre de répétitions souhaité."]},"Curl pupitre":{"eq":"Barre","m":["Biceps"],"s":[],"st":["Assieds-toi au pupitre, le haut de tes bras posé sur le coussin et ta poitrine contre le support.","Saisis la barre avec une prise en supination, un peu plus large que la largeur des épaules.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Curl incliné":{"eq":"Haltères","m":["Biceps"],"s":["Avant-bras"],"st":["Règle un banc incliné à un angle de 45 degrés et assieds-toi dessus avec un haltère dans chaque main, paumes tournées vers l'avant.","Pose le haut de tes bras sur le banc incliné et laisse tes coudes pendre vers le bas, en étendant complètement tes bras.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever les haltères jusqu'à ce que tes biceps soient complètement contractés et que les haltères soient à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser les haltères jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Curl poulie":{"eq":"Poulie","m":["Biceps"],"s":[],"st":["Tiens-toi face à la poulie, les pieds écartés à la largeur des épaules.","Saisis la poignée de la poulie avec une prise en supination, les paumes tournées vers le haut.","Garde tes coudes près de tes flancs et le haut de tes bras immobile.","Expire et remonte l'accessoire de la poulie vers tes épaules, en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement l'accessoire de la poulie jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Extension poulie":{"eq":"Poulie","m":["Triceps"],"s":[],"st":["Fixe une barre droite à une poulie haute.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, les mains écartées à la largeur des épaules.","Garde tes coudes près de tes flancs et le haut de tes bras immobile.","Expire et pousse la barre vers le bas jusqu'à ce que tes coudes soient complètement tendus.","Marque une pause, puis inspire et ramène lentement la barre à la position de départ.","Répète le nombre de répétitions souhaité."]},"Extension poulie corde":{"eq":"Poulie","m":["Triceps"],"s":[],"st":["Fixe une corde à une poulie haute.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la corde avec une prise neutre, les paumes tournées l'une vers l'autre.","Garde tes coudes près de tes flancs et le haut de tes bras immobile tout au long de l'exercice.","Expire et pousse la corde vers le bas en étendant tes coudes jusqu'à ce que tes bras soient complètement tendus.","Marque une pause, puis inspire et reviens lentement à la position de départ en laissant tes coudes fléchir.","Répète le nombre de répétitions souhaité."]},"Barre au front":{"eq":"Barre EZ","m":["Triceps"],"s":["Avant-bras"],"st":["Allonge-toi à plat sur un banc, les pieds à plat au sol et la tête au bout du banc.","Tiens la barre en prise pronation, les mains écartées à la largeur des épaules, et étends tes bras droit au-dessus de ta poitrine.","En gardant le haut des bras immobile, abaisse lentement la barre vers ton front en fléchissant tes coudes.","Marque une pause lorsque la barre est juste au-dessus de ton front, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Dips banc":{"eq":"Poids du corps","m":["Triceps"],"s":["Pectoraux","Épaules"],"st":["Assieds-toi au bord d'un banc ou d'une chaise, les mains agrippant le bord à côté de tes hanches.","Fais glisser tes fesses hors du banc et tends tes jambes devant toi, en gardant les talons au sol.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Extension nuque haltère":{"eq":"Haltères","m":["Triceps"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère d'une main.","Lève l'haltère au-dessus de ta tête en gardant ton bras tendu.","Plie ton coude et abaisse l'haltère derrière ta tête en gardant le haut de ton bras immobile.","Étends ton bras pour revenir vers le haut en position de départ.","Répète le nombre de répétitions souhaité."]},"Extension verticale poulie":{"eq":"Poulie","m":["Triceps"],"s":[],"st":["Fixe une corde à une poulie en position haute.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Saisis la corde des deux mains, les paumes tournées l'une vers l'autre, et amène tes mains au-dessus de ta tête.","Garde le haut des bras près de la tête et les coudes pointés vers l'avant.","Abaisse lentement la corde derrière ta tête en fléchissant les coudes.","Marque une pause, puis étends tes bras vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Développé serré":{"eq":"Barre","m":["Triceps"],"s":["Pectoraux","Épaules"],"st":["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise serrée, un peu plus étroite que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes près du corps.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."]},"Squat":{"eq":"Barre","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Place la barre sur le haut de ton dos, posée sur les trapèzes, et tiens-la à deux mains.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu commences à abaisser ton corps.","Fléchis les genoux et les hanches en poussant tes hanches vers l'arrière et vers le bas comme si tu t'asseyais sur une chaise.","Descends jusqu'à ce que tes cuisses soient parallèles au sol ou légèrement en dessous.","Garde les genoux alignés avec les orteils et le poids dans les talons.","Pousse sur tes talons pour te relever, en étendant tes hanches et tes genoux.","Répète le nombre de répétitions souhaité."]},"Squat avant":{"eq":"Barre","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Commence debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens la barre devant tes épaules, en la faisant reposer sur ta clavicule et tes épaules.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses ton corps en position de squat, en poussant tes hanches vers l'arrière et en pliant tes genoux.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Goblet squat":{"eq":"Haltères","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère verticalement contre ta poitrine à deux mains.","En gardant la poitrine relevée et la sangle abdominale gainée, abaisse ton corps en position de squat en poussant tes hanches vers l'arrière et en fléchissant tes genoux.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Hack squat":{"eq":"Barre","m":["Quadriceps"],"s":["Mollets","Avant-bras","Ischio-jambiers"],"st":["Commence debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens la barre derrière tes jambes, en la faisant reposer sur le haut de tes cuisses.","Abaisse ton corps en fléchissant les genoux et les hanches, en gardant ton dos droit et ta poitrine relevée.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Presse à cuisses":{"eq":"Machine","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Assieds-toi à la presse, le dos et les fesses bien plaqués contre le dossier.","Place tes pieds au milieu du plateau, écartés à la largeur des épaules.","Tends les jambes pour décoller le plateau, puis retire les sécurités.","Descends lentement le plateau jusqu'à ce que tes genoux forment un angle droit, sans décoller le bas du dos.","Pousse avec tout le pied pour remonter, sans bloquer les genoux en haut.","Répète le nombre de répétitions souhaité, puis remets les sécurités."]},"Fentes":{"eq":"Haltères","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main.","Fais un pas en avant avec le pied droit, en abaissant ton corps en position de fente.","Garde le dos droit et la poitrine relevée pendant que tu abaisses ton corps.","Pousse à travers ton talon droit pour revenir à la position de départ.","Répète avec ta jambe gauche.","Alterne les jambes pour le nombre de répétitions souhaité."]},"Fentes marchées":{"eq":"Poids du corps","m":["Quadriceps"],"s":["Mollets","Fessiers","Ischio-jambiers"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec la jambe droite, en abaissant ton corps en position de fente.","Garde le torse droit et le genou avant aligné avec la cheville.","Pousse sur ton pied droit et amène ton pied gauche vers l'avant, en te plaçant en position de fente avec ta jambe gauche.","Continue à alterner les jambes et à avancer en maintenant un rythme contrôlé et régulier.","Répète le nombre de répétitions souhaité."]},"Leg extension":{"eq":"Machine","m":["Quadriceps"],"s":[],"st":["Règle la hauteur du siège et le dossier de la machine pour les adapter à ton corps.","Assieds-toi sur la machine, le dos contre le dossier et le bas des jambes sous le coussin, juste au-dessus des chevilles.","Saisis les poignées ou les barres latérales pour te stabiliser.","Étends tes jambes vers l'avant en tendant les genoux, en soulevant le poids.","Marque une pause en haut, puis abaisse lentement le poids pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Leg curl":{"eq":"Machine","m":["Ischio-jambiers"],"s":["Mollets"],"st":["Règle la machine pour l'adapter à ton corps et sélectionne le poids souhaité.","Allonge-toi sur le ventre sur la machine, les jambes tendues, le coussin posé à l'arrière des chevilles.","Saisis les poignées ou les côtés de la machine pour te stabiliser.","En gardant le haut de ton corps immobile, expire et fléchis tes jambes le plus loin possible sans soulever tes hanches du coussin.","Maintiens la position contractée pendant une brève pause en contractant tes ischio-jambiers.","Inspire et abaisse lentement le levier jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Leg curl assis":{"eq":"Machine","m":["Ischio-jambiers"],"s":[],"st":["Règle la machine pour l'adapter à ton corps et assieds-toi dessus, le dos contre le dossier.","Place le bas de tes jambes sous le coussin, juste au-dessus de tes chevilles.","Saisis les poignées sur les côtés de la machine pour te soutenir.","En gardant le haut de tes jambes immobile, expire et fléchis tes jambes vers le haut aussi loin que possible.","Maintiens la position contractée pendant une brève pause en contractant tes ischio-jambiers.","Inspire et abaisse lentement le levier jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."]},"Soulevé de terre roumain":{"eq":"Barre","m":["Ischio-jambiers"],"s":["Mollets","Fessiers","Lombaires"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils pointés vers l'avant.","Tiens la barre en prise pronation, les mains un peu plus écartées que la largeur des épaules.","Fléchis les hanches en gardant ton dos droit et tes genoux légèrement fléchis.","Abaisse la barre vers le sol, en la gardant près de ton corps.","Sens l'étirement dans tes ischio-jambiers en abaissant la barre.","Une fois que tu ressens un étirement dans tes ischio-jambiers, pousse tes hanches vers l'avant et redresse-toi.","Contracte tes fessiers en haut du mouvement.","Abaisse la barre jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."]},"Hip thrust":{"eq":"Barre","m":["Fessiers"],"s":["Mollets","Ischio-jambiers"],"st":["Assieds-toi au sol, le haut du dos appuyé contre le bord d'un banc, une barre posée au pli des hanches (avec une mousse pour le confort).","Pose les pieds à plat, écartés à la largeur des hanches, les genoux fléchis.","Pousse dans tes talons et monte les hanches jusqu'à ce que ton buste et tes cuisses forment une ligne droite.","En haut, serre fort les fessiers une seconde, sans creuser le bas du dos.","Redescends lentement les hanches vers le sol.","Répète le nombre de répétitions souhaité."]},"Mollets debout":{"eq":"Machine","m":["Mollets"],"s":[],"st":["Règle la machine à ta hauteur et tiens-toi debout, les pieds écartés à la largeur des épaules.","Place tes épaules sous les coussins et tiens les poignées pour plus de stabilité.","Lève tes talons aussi haut que possible en étendant tes chevilles.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Mollets assis":{"eq":"Machine","m":["Mollets"],"s":[],"st":["Règle la hauteur du siège de sorte que tes genoux soient légèrement fléchis et que tes pieds soient à plat sur le repose-pieds.","Place tes orteils sur le repose-pieds, les talons dans le vide.","Saisis les poignées ou les côtés du siège pour te stabiliser.","Pousse sur la plante de tes pieds pour lever tes talons aussi haut que possible.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Crunch":{"eq":"Poids du corps","m":["Abdominaux"],"s":[],"st":["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et décolle tes épaules du sol, en t'enroulant vers l'avant en direction de tes genoux.","Marque une pause en haut, puis abaisse lentement tes épaules pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Relevé de jambes":{"eq":"Poids du corps","m":["Abdominaux"],"s":[],"st":["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou aussi haut que tu peux confortablement aller.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."]},"Crunch poulie":{"eq":"Poulie","m":["Abdominaux"],"s":[],"st":["Fixe une poignée à corde à une poulie haute et agenouille-toi dos à la machine.","Tiens la poignée corde des deux mains et place-la derrière ta tête, en gardant tes coudes vers les côtés.","En gardant tes hanches immobiles, fléchis ta taille et enroule ton torse vers tes cuisses.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."]},"Gainage":{"eq":"Poids du corps","m":["Abdominaux"],"s":[],"st":["Mets-toi face au sol, en appui sur les avant-bras et la pointe des pieds, les coudes sous les épaules.","Aligne la tête, le dos et les jambes : ni fesses en l'air, ni dos creusé.","Serre les abdos et les fessiers, et respire calmement.","Tiens la position le temps voulu, puis repose les genoux au sol."]},"Développé couché prise large":{"eq":"Barre","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise large, un peu plus large que la largeur des épaules.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse lentement la barre vers ta poitrine, en gardant tes coudes légèrement écartés.","Marque une pause lorsque la barre touche ta poitrine, puis repousse-la vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Développé couché Smith":{"eq":"Machine guidée","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Règle la hauteur de la barre de la machine Smith à hauteur de la poitrine.","Allonge-toi à plat sur le banc, les pieds fermement ancrés au sol.","Saisis la barre avec une prise en pronation légèrement plus écartée que la largeur des épaules.","Sors la barre du support et abaisse-la vers ta poitrine, en gardant les coudes rentrés.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Développé incliné Smith":{"eq":"Machine guidée","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Règle le banc sur une inclinaison de 30 à 45 degrés.","Assieds-toi sur le banc, le dos bien à plat contre le coussin et les pieds fermement au sol.","Saisis la barre avec une prise en pronation un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers le haut de ta poitrine, en gardant les coudes légèrement rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ, en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Développé décliné haltères":{"eq":"Haltères","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Allonge-toi sur un banc décliné, les pieds bloqués et la tête plus basse que les hanches.","Tiens un haltère dans chaque main et étends les bras droit au-dessus de ta poitrine, les paumes tournées vers l'avant.","Abaisse lentement les haltères sur les côtés de ta poitrine, en gardant tes coudes à un angle de 90 degrés.","Repousse les haltères vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Développé couché haltères prise neutre":{"eq":"Haltères","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Tiens un haltère dans chaque main avec une prise neutre (paumes tournées l'une vers l'autre) et les bras étendus droit au-dessus de ta poitrine.","Abaisse lentement les haltères vers ta poitrine, en gardant tes coudes près de ton corps.","Marque une pause en bas, puis pousse les haltères vers le haut jusqu'à la position de départ, en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Développé incliné machine":{"eq":"Machine","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Règle le siège et le dossier de la machine dans une position confortable.","Assieds-toi sur la machine, le dos contre le dossier et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et place tes mains légèrement plus écartées que la largeur des épaules.","Pousse les poignées vers l'avant et loin de ton corps jusqu'à ce que tes bras soient complètement tendus.","Marque une pause, puis plie lentement tes coudes et ramène les poignées vers ta poitrine.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Écarté incliné haltères":{"eq":"Haltères","m":["Pectoraux"],"s":["Épaules"],"st":["Règle un banc incliné à un angle de 45 degrés.","Assieds-toi sur le banc avec un haltère dans chaque main, paumes tournées l'une vers l'autre.","Allonge-toi sur le dos sur le banc et pousse les haltères vers le haut jusqu'à la position de départ, directement au-dessus de ta poitrine.","Abaisse les haltères sur les côtés en un large arc de cercle jusqu'à ce que tu ressentes un étirement dans ta poitrine.","Marque une pause, puis contracte tes muscles pectoraux pour ramener les haltères vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Écarté décliné haltères":{"eq":"Haltères","m":["Pectoraux"],"s":[],"st":["Allonge-toi sur un banc décliné, les pieds bloqués et la tête plus basse que les hanches.","Tiens un haltère dans chaque main, les paumes tournées l'une vers l'autre et les bras étendus au-dessus de ta poitrine.","Abaisse les haltères sur les côtés en un large arc de cercle jusqu'à ce que tu ressentes un étirement dans ta poitrine.","Marque une pause, puis contracte tes muscles pectoraux pour ramener les haltères à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Écarté poulie basse":{"eq":"Poulie","m":["Pectoraux"],"s":["Épaules"],"st":["Fixe les poignées aux poulies basses et sélectionne un poids approprié.","Tiens-toi au milieu de la machine, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis les poignées avec une prise en pronation et étends les bras sur les côtés, en gardant une légère flexion dans les coudes.","Tout en contrôlant le mouvement, ramène lentement tes bras vers l'avant dans un geste ample, en les croisant devant ton corps.","Marque une pause au sommet du mouvement, en sentant l'étirement dans les muscles de ta poitrine.","Inverse le mouvement et ramène lentement tes bras à la position de départ, en gardant la tension sur les muscles de ta poitrine tout du long.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Écarté incliné poulie":{"eq":"Poulie","m":["Pectoraux"],"s":["Épaules"],"st":["Règle la poulie en position basse et attache les poignées.","Assieds-toi sur un banc incliné, le dos contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et étends les bras droit devant toi.","En gardant une légère flexion des coudes, ouvre les bras sur les côtés dans un mouvement contrôlé.","Marque une pause en position complètement étendue, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Pull-over haltère":{"eq":"Haltères","m":["Pectoraux"],"s":["Grand dorsal","Épaules","Triceps"],"st":["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds fermement ancrés au sol.","Tiens un haltère des deux mains et étends les bras droit au-dessus de ta poitrine.","En gardant les bras tendus, abaisse lentement l'haltère derrière ta tête dans un mouvement en arc.","Marque une pause, puis ramène l'haltère à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Pompes pieds surélevés":{"eq":"Poids du corps","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Place tes mains au sol légèrement plus écartées que la largeur des épaules, avec tes pieds surélevés sur une surface stable.","Garde ton corps bien aligné de la tête aux pieds, en gainant ta sangle abdominale.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en les gardant près de ton corps.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Pompes inclinées":{"eq":"Poids du corps","m":["Pectoraux"],"s":["Épaules","Triceps"],"st":["Place tes mains sur une surface surélevée, comme un banc ou une marche, légèrement plus écartées que la largeur des épaules.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, en formant une ligne droite de ta tête à tes talons.","Abaisse ta poitrine vers la surface surélevée en fléchissant les coudes, en gardant ton corps aligné.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Pompes prise large":{"eq":"Poids du corps","m":["Pectoraux"],"s":["Abdominaux","Épaules","Triceps"],"st":["Commence en position de planche haute, les mains plus écartées que la largeur des épaules.","Garde ton corps bien aligné de la tête aux pieds.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Pectoraux"},"Rowing haltères deux bras":{"eq":"Haltères","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens un haltère dans chaque main, paumes tournées vers ton corps.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Laisse tes bras pendre droit vers le bas en direction du sol, les coudes légèrement fléchis.","Tire les haltères vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rowing barre prise inversée":{"eq":"Barre","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la barre en prise supination, les paumes tournées vers le haut, les mains à la largeur des épaules.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute, jusqu'à ce que ton torse soit presque parallèle au sol.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rowing sur banc incliné":{"eq":"Haltères","m":["Milieu du dos"],"s":["Biceps","Avant-bras","Grand dorsal","Épaules"],"st":["Installe un banc incliné à un angle de 45 degrés.","Saisis un haltère dans chaque main et assieds-toi sur le banc, la poitrine contre l'inclinaison.","Étends complètement tes bras, en laissant les haltères pendre droit vers le bas depuis tes épaules.","Tire les haltères vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rowing poulie un bras":{"eq":"Poulie","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Trapèzes"],"st":["Assieds-toi sur un banc face à une poulie, les pieds à plat sur le sol et les genoux légèrement fléchis.","Saisis la poignée d'une main et garde ton bras complètement tendu devant toi.","Tire la poignée vers ton corps en rétractant ton omoplate et en gardant ton coude près de ton flanc.","Marque une pause en haut du mouvement, en contractant les muscles de ton dos.","Relâche lentement la poignée pour revenir à la position de départ.","Répète avec l'autre bras.","Alterne les bras pour le nombre de répétitions souhaité."],"g":"Dos"},"Rowing machine":{"eq":"Machine","m":["Grand dorsal"],"s":["Biceps","Milieu du dos"],"st":["Règle la hauteur du siège et les repose-pieds dans une position confortable.","Assieds-toi sur la machine, la poitrine contre le coussinet et les pieds sur les repose-pieds.","Saisis les poignées avec une prise en pronation, écartées à la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée.","Tire les poignées vers ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet du mouvement.","Relâche lentement les poignées et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rowing Smith":{"eq":"Machine guidée","m":["Milieu du dos"],"s":["Biceps","Grand dorsal","Épaules"],"st":["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi face à la barre, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rowing kettlebell un bras":{"eq":"Kettlebell","m":["Milieu du dos"],"s":["Biceps","Grand dorsal"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et ta sangle abdominale gainée.","Tire le kettlebell vers le haut en direction de ta poitrine en gardant ton coude près de ton corps et en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement le kettlebell pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté et recommence avec l'autre bras."],"g":"Dos"},"Tirage vertical prise inversée":{"eq":"Poulie","m":["Grand dorsal"],"s":["Biceps","Milieu du dos","Épaules"],"st":["Règle la poulie de sorte que la barre de tirage soit à une hauteur au-dessus de ta tête.","Assieds-toi sur le siège et saisis la barre de tirage avec une prise en supination, les mains un peu plus écartées que la largeur des épaules.","Garde le dos droit et penche-toi légèrement vers l'arrière.","Tire la barre vers ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Tirage vertical prise neutre":{"eq":"Poulie","m":["Grand dorsal"],"s":["Biceps","Milieu du dos","Épaules"],"st":["Assieds-toi à la machine de tirage vertical et saisis la poignée en V, les paumes face à face.","Règle le coussin des genoux pour bien bloquer tes cuisses.","Garde le dos droit et penche-toi légèrement vers l'arrière.","Tire la barre en V vers le bas en direction du haut de ta poitrine en gardant tes coudes près de ton corps.","Contracte les muscles de ton dos en bas du mouvement.","Ramène lentement la barre en V à la position de départ et répète pour le nombre de répétitions souhaité."],"g":"Dos"},"Tirage vertical un bras":{"eq":"Poulie","m":["Grand dorsal"],"s":["Biceps","Milieu du dos"],"st":["Fixe une poignée simple à une poulie haute.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la poignée avec une prise en pronation et étends complètement ton bras.","Garde le dos droit et ta sangle abdominale gainée.","Tire la poignée vers le bas le long de ton flanc en gardant ton coude près de ton corps.","Marque une pause en bas du mouvement, en contractant ton grand dorsal.","Relâche lentement la poignée pour revenir à la position de départ.","Répète le nombre de répétitions souhaité.","Change de côté et répète l'exercice avec l'autre bras."],"g":"Dos"},"Pull-over poulie corde":{"eq":"Poulie","m":["Grand dorsal"],"s":[],"st":["Fixe une corde à la poulie au réglage le plus haut.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la corde des deux mains, les paumes tournées vers le bas.","Étends complètement tes bras devant toi, en gardant tes coudes légèrement fléchis.","Contracte tes grands dorsaux et tire lentement la corde vers le bas jusqu'à tes cuisses, en gardant les bras tendus.","Marque une pause en bas, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Shrugs barre":{"eq":"Barre","m":["Trapèzes"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre devant toi en prise pronation.","Garde tes bras tendus et ton dos droit tout au long de l'exercice.","Monte tes épaules vers tes oreilles aussi haut que possible, en contractant tes trapèzes en haut.","Maintiens un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Shrugs machine":{"eq":"Machine","m":["Trapèzes"],"s":["Avant-bras"],"st":["Règle la hauteur du siège et installe-toi sur la machine, le dos contre le coussin.","Saisis les poignées avec une prise en pronation et garde les bras tendus.","En gardant le dos droit, lève tes épaules vers tes oreilles le plus haut possible.","Maintiens la contraction un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Soulevé de terre sumo":{"eq":"Barre","m":["Ischio-jambiers"],"s":["Adducteurs","Avant-bras","Fessiers","Lombaires","Milieu du dos","Quadriceps","Trapèzes"],"st":["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils tournés vers l'extérieur.","Place une barre au sol devant toi, centrée entre tes pieds.","Fléchis les genoux et abaisse tes hanches, en gardant le dos droit et la poitrine relevée, pour saisir la barre en prise pronation.","Gaine ta sangle abdominale et pousse sur tes talons pour soulever la barre du sol, en étendant tes hanches et tes genoux simultanément.","En soulevant, garde ta poitrine ouverte et ton dos droit, et pousse tes hanches vers l'avant pour bien engager tes fessiers.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Rack pull":{"eq":"Barre","m":["Lombaires"],"s":["Avant-bras","Fessiers","Ischio-jambiers","Trapèzes"],"st":["Installe une barre sur un rack à hauteur de genou.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Fléchis les hanches et les genoux pour descendre et saisis la barre en prise pronation, les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et soulève la barre en étendant tes hanches et tes genoux, en ramenant tes épaules en arrière et en contractant tes fessiers en haut.","Abaisse la barre jusqu'à la position de départ en fléchissant les hanches et les genoux.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Soulevé de terre jambes tendues":{"eq":"Barre","m":["Ischio-jambiers"],"s":["Fessiers","Lombaires"],"st":["Tiens-toi debout, les pieds écartés à la largeur des hanches, la barre tenue devant les cuisses, les mains à la largeur des épaules.","Garde les jambes presque tendues : les genoux sont à peine fléchis et ne bougent plus.","Penche le buste en avant en poussant les fesses vers l'arrière, le dos bien droit, et laisse descendre la barre le long des jambes.","Descends jusqu'à sentir l'étirement à l'arrière des cuisses, sans arrondir le dos.","Remonte en contractant les fessiers et l'arrière des cuisses.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Good morning":{"eq":"Barre","m":["Ischio-jambiers"],"s":["Abdominaux","Fessiers","Lombaires"],"st":["Commence debout, les pieds écartés à la largeur des épaules et la barre posée sur le haut du dos.","En gardant le dos droit et ta sangle abdominale gainée, bascule vers l'avant au niveau des hanches, en poussant tes fessiers vers l'arrière comme si tu essayais de toucher le mur derrière toi avec tes fessiers.","Abaisse ton torse jusqu'à ce qu'il soit parallèle au sol, en ressentant un étirement dans tes ischio-jambiers.","Marque une pause, puis reviens à la position de départ en contractant tes fessiers et en poussant tes hanches vers l'avant.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Extensions lombaires":{"eq":"Banc","m":["Lombaires"],"s":["Fessiers","Ischio-jambiers"],"st":["Règle le banc à lombaires de sorte que tes hanches reposent confortablement sur le coussin et que tes pieds soient bien fixés.","Croise tes bras sur ta poitrine ou place tes mains derrière ta tête.","Abaisse lentement le haut de ton corps vers le sol tout en gardant le dos droit.","Marque une pause en bas, puis relève le haut de ton corps jusqu'à ce qu'il soit aligné avec tes jambes.","Répète le nombre de répétitions souhaité."],"g":"Dos"},"Développé militaire assis":{"eq":"Barre","m":["Épaules"],"s":["Triceps"],"st":["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre en prise pronation, un peu plus écartée que la largeur des épaules.","Soulève la barre du rack et amène-la à hauteur des épaules, les coudes fléchis et les paumes tournées vers l'avant.","Développe la barre au-dessus de ta tête en tendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement la barre à hauteur des épaules.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Développé épaules machine":{"eq":"Machine","m":["Épaules"],"s":["Triceps"],"st":["Règle la hauteur du siège et installe-toi sur la machine, le dos contre le dossier.","Saisis les poignées avec une prise en pronation et place tes mains à hauteur des épaules.","Pousse les poignées vers le haut jusqu'à ce que tes bras soient complètement tendus, mais ne verrouille pas tes coudes.","Marque une pause en haut, puis abaisse lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Développé épaules Smith":{"eq":"Machine guidée","m":["Épaules"],"s":["Triceps"],"st":["Règle la hauteur du siège et installe-toi sur la machine Smith, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et positionne-la à hauteur des épaules, les coudes fléchis et les paumes tournées vers l'avant.","Pousse la barre vers le haut jusqu'à ce que tes bras soient complètement tendus au-dessus de ta tête.","Marque une pause en haut, puis abaisse lentement la barre à hauteur des épaules.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Développé haltères debout":{"eq":"Haltères","m":["Épaules"],"s":["Triceps"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main à hauteur d'épaule, paumes tournées vers l'avant.","Pousse les haltères vers le haut jusqu'à ce que tes bras soient complètement tendus au-dessus de ta tête.","Marque une pause en haut, puis abaisse lentement les haltères à hauteur des épaules.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Élévations latérales assis":{"eq":"Haltères","m":["Épaules"],"s":[],"st":["Assieds-toi sur un banc, les pieds à plat sur le sol et un haltère dans chaque main, posés sur tes cuisses.","Garde le dos droit et ta sangle abdominale gainée.","Lève les haltères sur tes côtés avec une légère flexion des coudes, jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Élévation latérale poulie":{"eq":"Poulie","m":["Épaules"],"s":["Avant-bras"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et saisis les poignées de la poulie en prise pronation.","Garde tes bras tendus et ta sangle abdominale gainée.","Lève tes bras sur les côtés jusqu'à ce qu'ils soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Élévations frontales poulie":{"eq":"Poulie","m":["Épaules"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et saisis la poignée de la poulie en prise pronation.","Garde le dos droit et ta sangle abdominale gainée.","Lève la poignée de la poulie devant toi en gardant tes bras tendus et tes paumes tournées vers le bas.","Continue à soulever jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement la poignée de la poulie pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Oiseau machine":{"eq":"Machine","m":["Épaules"],"s":[],"st":["Règle la hauteur du siège et installe-toi sur la machine, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et garde les bras légèrement fléchis.","Expire et resserre tes omoplates en tirant les poignées vers l'arrière et vers l'extérieur, loin de ton corps.","Marque une pause au sommet de la contraction, puis inspire et reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Oiseau poulie":{"eq":"Poulie","m":["Épaules"],"s":[],"st":["Règle les deux poulies à hauteur d'épaules et tiens-toi au milieu, face à la machine.","Saisis la poignée de droite avec la main gauche et celle de gauche avec la main droite, les bras tendus devant toi.","Écarte les bras vers l'arrière en arc de cercle, les coudes légèrement fléchis, jusqu'à les avoir en ligne avec tes épaules.","Serre les omoplates une seconde.","Reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Oiseau assis":{"eq":"Haltères","m":["Épaules"],"s":[],"st":["Assieds-toi au bout d'un banc, un haltère dans chaque main, les pieds à plat.","Penche le buste en avant jusqu'à presque toucher tes cuisses, le dos droit, les haltères sous les jambes, les paumes face à face.","Les coudes légèrement fléchis, lève les bras sur les côtés jusqu'à ce qu'ils soient parallèles au sol.","Serre les omoplates une seconde.","Redescends lentement.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Rowing menton barre":{"eq":"Barre","m":["Épaules"],"s":["Trapèzes"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Laisse la barre pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit et la sangle abdominale gainée, expire et soulève la barre droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Rowing menton haltères":{"eq":"Haltères","m":["Trapèzes"],"s":["Biceps","Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main en prise pronation.","Laisse les haltères pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit et ta sangle abdominale gainée, expire et soulève les haltères droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Rowing menton poulie":{"eq":"Poulie","m":["Trapèzes"],"s":["Épaules"],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens l'accessoire de la poulie en prise pronation.","Garde le dos droit et ta sangle abdominale gainée tout au long de l'exercice.","Tire l'accessoire de la poulie droit vers le haut en direction de ton menton, en menant avec tes coudes.","Marque une pause en haut, en rapprochant tes omoplates l'une de l'autre.","Abaisse lentement la poignée de la poulie vers la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Rotation externe poulie":{"eq":"Poulie","m":["Épaules"],"s":[],"st":["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la poignée de poulie, le bras étendu devant toi, parallèle au sol.","Garde ton coude légèrement fléchi et tes omoplates tirées vers l'arrière.","Fais pivoter lentement ton bras vers l'extérieur, en l'éloignant de ton corps, tout en gardant ton coude dans la même position.","Marque une pause à la fin du mouvement, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Écartement élastique":{"eq":"Élastique","m":["Épaules"],"s":["Milieu du dos","Trapèzes"],"st":["Debout, tiens un élastique devant toi à hauteur des épaules, les bras tendus, les mains écartées à la largeur des épaules.","Écarte les bras sur les côtés en les gardant tendus, jusqu'à ce que l'élastique touche ta poitrine.","Serre les omoplates une seconde.","Reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],"g":"Épaules"},"Curl barre EZ":{"eq":"Barre EZ","m":["Biceps"],"s":[],"st":["Tiens-toi bien droit,
