<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Forme</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header, scrolling content, thumb-height bottom tab bar, bottom sheets for every input. One accent at a time, set by the active tab. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface2:#E7EAF0; --ink:#14181F; --muted:#586170; --line:#D8DCE4;
  --c-weight:#2F6BFF; --c-food:#D96A0E; --c-gym:#D8483A; --c-scan:#12865A;
  --accent:var(--c-weight); --on-accent:#FFFFFF; --accent-soft:rgba(47,107,255,.12);
  --good:#12865A; --warn:#C98A0A; --bad:#D8483A;
  --shadow:0 1px 2px rgba(20,24,31,.06),0 6px 20px rgba(20,24,31,.06);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1015; --surface:#171B22; --surface2:#222731; --ink:#ECEFF4; --muted:#9AA3B2; --line:#2B313C;
  --c-weight:#6C94FF; --c-food:#F59A4D; --c-gym:#F2756A; --c-scan:#3DC68D;
  --on-accent:#0D1015; --good:#3DC68D; --warn:#EBB43C; --bad:#F2756A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#171B22; --surface2:#222731; --ink:#ECEFF4; --muted:#9AA3B2; --line:#2B313C;
  --c-weight:#6C94FF; --c-food:#F59A4D; --c-gym:#F2756A; --c-scan:#3DC68D;
  --on-accent:#0D1015; --good:#3DC68D; --warn:#EBB43C; --bad:#F2756A; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:0 calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto;overflow-x:hidden}
#app[data-tab="weight"]{--accent:var(--c-weight)}
#app[data-tab="food"]{--accent:var(--c-food)}
#app[data-tab="gym"]{--accent:var(--c-gym)}
#app[data-tab="scan"]{--accent:var(--c-scan)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;margin-inline:-16px;padding-inline:16px;background:var(--bg)}
.top h1{margin:0;font:800 26px/1 var(--font-display);letter-spacing:-.03em}
.top h1 span{color:var(--accent)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:560px;margin-inline:auto}
.tab{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--tc);background:var(--tcs)}
.tab[data-t="weight"]{--tc:var(--c-weight);--tcs:rgba(47,107,255,.12)}
.tab[data-t="food"]{--tc:var(--c-food);--tcs:rgba(217,106,14,.13)}
.tab[data-t="gym"]{--tc:var(--c-gym);--tcs:rgba(216,72,58,.12)}
.tab[data-t="scan"]{--tc:var(--c-scan);--tcs:rgba(18,134,90,.13)}

/* cards & basics */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2,.sec{margin:0 0 10px;font:700 13px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.soft{background:var(--accent-soft);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:14px}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{min-height:40px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;width:100%;text-align:left}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom,0px));z-index:25;height:56px;padding:0 22px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font:800 22px/1.15 var(--font-display);letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%}

/* weight */
.wbig{display:flex;align-items:center;justify-content:center;gap:12px}
.wbig .step{width:52px;height:52px;flex:none;border-radius:18px;background:var(--surface2);font:700 28px/1 var(--font-display)}
.wbig input{flex:1;max-width:190px;width:auto;text-align:center;border:0;background:transparent;font:800 clamp(40px,14vw,56px)/1 var(--font-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:0}
.wbig input:focus{outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 10px 9px;min-width:0}
.stat b{display:block;font:800 22px/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.readout{min-height:44px;margin-bottom:6px}
.readout b{font:800 26px/1 var(--font-display);font-variant-numeric:tabular-nums}

/* food */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datebar .d{font:700 17px/1.1 var(--font-display);text-align:center}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.macro{margin-bottom:9px}
.macro .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:4px}
.macro .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.slot h4{margin:0;font-size:16px}
.entry{display:flex;gap:10px;align-items:center;min-height:52px;padding:6px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.entry .grow{flex:1;min-width:0}
.addslot{min-height:44px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:6px;width:100%;border-top:1px solid var(--line)}
/* recettes */
.rcl{margin:0 0 18px;padding-left:22px}
.rcl li{margin:0 0 8px;padding-left:2px;overflow-wrap:anywhere}
ol.rcl li::marker{font-weight:800;color:var(--accent)}
.card.empty{box-shadow:none}
.sc{--accent:var(--c-scan)}  /* feuilles du Scan : le calque est hors de #app */
.libcard{padding:4px 16px}
.libsec+.libsec{border-top:1px solid var(--line,rgba(127,127,127,.18))}
.libh{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;font:700 16px/1.2 var(--font-body);text-align:left;color:var(--ink)}
.libh[disabled]{opacity:.45}
.libchev{display:inline-flex;transition:transform .15s}
.libh[aria-expanded="true"] .libchev{transform:rotate(90deg)}
.libh[disabled] .libchev{visibility:hidden}
.libbody{padding:0 0 10px 6px}
.libsub{margin:12px 0 2px}
.rc{--accent:var(--c-food)}  /* le calque des feuilles est hors de #app : on remet l'orange du Repas */
.rcslotseg button{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;min-height:44px;padding:0 14px;white-space:nowrap}

/* gym */
.ex{margin-bottom:14px}
.ex .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex .hd b{font-size:17px}
.sets{display:grid;grid-template-columns:24px minmax(0,1fr) 74px 62px 44px;gap:8px 6px;align-items:center}
.sets .h{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.sets .n{font-weight:800;text-align:center;color:var(--muted)}
.sets .prev{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);text-align:center;font:700 17px var(--font-display);font-variant-numeric:tabular-nums;padding:0 4px;min-width:0}
.sets input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.sets .ck{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;justify-self:center}
.sets .ck svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sets .ck[aria-pressed="true"]{background:var(--good)}
.sets .ck[aria-pressed="true"] svg{stroke:#fff}
.sets .done input{background:color-mix(in srgb,var(--good) 14%,transparent);border-color:transparent}
.rest{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rest b{font:800 24px/1 var(--font-display);font-variant-numeric:tabular-nums}
.rest button{min-height:36px;padding:0 12px;border-radius:10px;background:rgba(127,127,127,.3);color:inherit;font-weight:700}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

/* scan */
.score{display:flex;align-items:center;gap:16px}
.badge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:800 32px/1 var(--font-display);color:#fff;flex:none;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.neutral{background:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ring & thumbs */
.ringbig{position:relative;width:min(240px,72vw);aspect-ratio:1;margin:4px auto 6px}
.ringbig svg{width:100%;height:100%;display:block}
.ringbig .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbig .c b{font:800 clamp(38px,12vw,52px)/1 var(--font-display);letter-spacing:-.04em}
.pals{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pal{flex:none;padding:5px 11px;border-radius:999px;background:var(--surface2);color:var(--muted);font:700 13px var(--font-display);font-variant-numeric:tabular-nums}
.pal.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.pal.next{background:var(--accent);color:var(--on-accent)}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--surface2);flex:none;display:block}
.thumb.ph{display:grid;place-items:center;font:800 18px var(--font-display);color:var(--muted)}
.thumbbtn{flex:none;border-radius:12px;padding:0;line-height:0}
.exinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.exinfo figure{margin:0}.exinfo img{width:100%;border-radius:14px;display:block;background:var(--surface2)}
.exinfo figcaption{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.bcbox{border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center}
.bcnum{font:800 22px var(--font-display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sloticon{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;flex:none}
.sloticon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mmap{width:100%;max-width:320px;display:block;margin:0 auto;background:var(--surface);border-radius:18px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.thumb{object-fit:contain;padding:2px}
.ringbig{width:100%;max-width:300px;aspect-ratio:1;margin:0 auto 4px}
.ringbig .c b{font-size:clamp(34px,11vw,46px)}
.actgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.actgrid .stat{text-align:left}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.abars{display:flex;align-items:flex-end;gap:7px;height:70px}
.abar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.abar i{display:block;width:14px;border-radius:4px}
.abar span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.thumb{object-fit:cover;background:#090C12}
.mov{position:relative;width:100%;aspect-ratio:3/2;border-radius:16px;overflow:hidden;background:#090C12}
.mov img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .3s}
.mov img.on{opacity:1}
.movcap{position:absolute;left:10px;bottom:10px;background:rgba(10,12,16,.72);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.rbar{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;max-width:536px;margin-inline:auto;display:flex;align-items:stretch;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 10px 30px rgba(10,14,25,.18);overflow:hidden}
.rbar.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(127,127,127,.28);width:100%;pointer-events:none;transition:width 1s linear}
.rbar .rgo{flex:1;min-height:48px;border-radius:13px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
.rbar .rdur{min-height:48px;padding:0 14px;border-radius:13px;background:var(--surface2);color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.rbar .rmain{position:relative;min-height:48px;padding:0 12px;border-radius:13px;background:rgba(127,127,127,.26);color:inherit;font-weight:800;font-size:15px}
.rbar .rclock{position:relative;flex:1;min-height:48px;border-radius:13px;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rbar .rclock b{font:800 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
.durs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dur{min-height:52px;border-radius:14px;background:var(--surface2);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.dur.on{background:var(--accent);color:var(--on-accent)}
.rr{display:grid;grid-template-columns:40px 54px 40px 1fr 1fr;gap:8px;align-items:center;margin-top:12px}
.rr>span{text-align:center;line-height:1.1}
.rr>span b{font:800 18px/1 var(--font-display);display:block;font-variant-numeric:tabular-nums}
.rr>span i{font-size:11px;color:var(--muted);font-style:normal;font-weight:600}
.rstep{height:40px;border-radius:12px;background:var(--surface2);font:800 20px/1 var(--font-display);color:var(--ink)}
.rin{min-height:40px;border-radius:12px;background:var(--surface2);border:0;text-align:center;font:600 15px/1 var(--font-body);color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.rin::placeholder{color:var(--muted);font-weight:500}
</style>

<script>
(function(){'use strict';
/* ===== utils ===== */
const APP_VER='2026.10.08-12';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const dn=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fmtLong=s=>parseD(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=s=>parseD(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtDay=s=>parseD(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const nf=(n,d=1)=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:d});
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const ICON={
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="20" height="20" style="stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M9 5l7 7-7 7"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"/></svg>',
  cam:'<svg viewBox="0 0 24 24" width="22" height="22" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

/* ===== state & storage ===== */
const LS='forme.v1';
const defaults=()=>({settings:{kcal:2200,p:150,c:250,f:70,goalW:80,startW:null,step:2.5,rest:90,auto:true,pkg:2,fkg:1,steps:10000},weights:{},foods:[],meals:{},routines:[],sessions:[],exercises:[],scans:[],act:{},recipes:{done:{},notes:{},mine:[]},active:null,ui:{tab:'weight'},_t:{}});
let S=defaults();
try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S=Object.assign(defaults(),o);S.settings=Object.assign(defaults().settings,o.settings||{})}}catch(e){}
function migrateSettings(){const g=S.settings;if(!g.v2){g.v2=1;if(g.goalW==null)g.goalW=80;if(!g.step)g.step=2.5;return true}return false}
const migrated=migrateSettings();
const SLICES=['settings','weights','foods','routines','exercises','scans','act','recipes','active'];
const docOf=(slice,key)=>slice==='meals'?'meals_'+String(key).slice(0,7):slice==='sessions'?'sessions_'+String(key).slice(0,4):slice;
function docValue(id){
  if(id.startsWith('meals_')){const p=id.slice(6),o={};for(const k in S.meals)if(k.startsWith(p)&&S.meals[k].length)o[k]=S.meals[k];return o}
  if(id.startsWith('sessions_')){const y=id.slice(9);return S.sessions.filter(x=>x.date.startsWith(y))}
  return S[id]===undefined?null:S[id];
}
function applyDoc(id,v){
  if(id.startsWith('meals_')){const p=id.slice(6);for(const k of Object.keys(S.meals))if(k.startsWith(p))delete S.meals[k];Object.assign(S.meals,v||{})}
  else if(id.startsWith('sessions_')){const y=id.slice(9);S.sessions=S.sessions.filter(x=>!x.date.startsWith(y)).concat(v||[])}
  else if(SLICES.includes(id)){S[id]=v===null&&id!=='active'?defaults()[id]:v;if(id==='settings'){S.settings=Object.assign(defaults().settings,S.settings);if(migrateSettings())dirty.add('settings')}}
}
function localIds(){
  const ids=new Set(SLICES);
  for(const k in S.meals)if(S.meals[k].length)ids.add(docOf('meals',k));
  for(const s of S.sessions)ids.add(docOf('sessions',s.date));
  return ids;
}
let dbc=null,syncState='local',dirty=new Set(),saveTimer=null;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function persist(slice,key){
  const id=docOf(slice,key);dirty.add(id);S._t[id]=Date.now();saveLocal();
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,900);
}
async function flush(){
  if(!dbc||!dirty.size)return;
  const ids=[...dirty];dirty.clear();
  for(const id of ids){
    try{await dbc.doc(id).set({t:S._t[id]||Date.now(),v:docValue(id)});syncState='ok'}
    catch(e){dirty.add(id);syncState='error'}
  }
}
async function initDb(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbc=db.collection('data/users/'+id);
    const snap=await dbc.get();
    const remote=new Map();
    snap.docs.forEach(d=>{const x=d.data();if(x)remote.set(d.id,x)});
    let changed=false;
    for(const [rid,x] of remote){
      const lt=S._t[rid]||0;
      if((x.t||0)>lt){applyDoc(rid,x.v);S._t[rid]=x.t;changed=true}
      else if(lt>(x.t||0))dirty.add(rid);
    }
    for(const lid of localIds()){
      if(remote.has(lid))continue;
      const v=docValue(lid);
      const empty=v===null||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
      if(!empty){if(!S._t[lid])S._t[lid]=Date.now();dirty.add(lid)}
    }
    syncState='ok';saveLocal();
    if(changed)render();
    flush();
  }catch(e){dbc=null;syncState='local'}
}

/* ===== ui helpers ===== */
const A={},I={};
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function openSheet(html){
  $('#layer').innerHTML='<div class="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
}
function closeSheet(){$('#layer').innerHTML=''}
const sheetOpen=()=>!!$('#layer .scrim');
function confirmSheet(title,text,okLabel,onOk){
  openSheet('<h3>'+esc(title)+'</h3><p class="muted" style="margin:0 0 16px">'+esc(text)+'</p><div class="grid2"><button class="btn ghost" data-act="close">Annuler</button><button class="btn danger" data-act="confirm-ok">'+esc(okLabel)+'</button></div>');
  A['confirm-ok']=()=>{closeSheet();onOk()};
}
A.close=()=>closeSheet();
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('scrim')){closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=A[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&I[k])I[k](e.target,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(k&&I[k])I[k](e.target,e)});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('input,textarea,select'))setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},320)});

/* ===== chart ===== */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(el,o){
  const W=Math.max(260,el.clientWidth||340),H=o.h||210,m={l:40,r:12,t:12,b:26};
  const pts=o.pts||[],line=o.line||[];
  const all=pts.concat(line);
  if(!all.length){el.innerHTML='';return}
  let xs=all.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  if(x1-x0<6){const c=(x0+x1)/2;x0=c-3;x1=c+3}
  let ys=all.map(p=>p.y);if(o.goal!=null)ys.push(o.goal);
  let y0=Math.min(...ys),y1=Math.max(...ys);if(y1-y0<(o.minSpan||1)){const c=(y0+y1)/2;y0=c-(o.minSpan||1)/2;y1=c+(o.minSpan||1)/2}
  const step=niceStep((y1-y0)/3.5);
  y0=Math.floor((y0-(y1-y0)*.06)/step)*step;y1=Math.ceil((y1+(y1-y0)*.06)/step)*step;
  const X=x=>m.l+(x-x0)/(x1-x0)*(W-m.l-m.r),Y=y=>m.t+(1-(y-y0)/(y1-y0))*(H-m.t-m.b);
  let g='';
  for(let v=y0;v<=y1+1e-9;v+=step){const yy=Y(v);g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/><text x="'+(m.l-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+nf(v,step<1?1:0)+'</text>'}
  const xl=[[x0,'start'],[(x0+x1)/2,'middle'],[x1,'end']];
  const dstr=x=>{const d=new Date(x*864e5);return fmtShort(d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()))};
  xl.forEach(([x,a])=>{g+='<text x="'+(a==='start'?m.l:a==='end'?W-m.r:X(x))+'" y="'+(H-6)+'" text-anchor="'+a+'" font-size="11" fill="var(--muted)">'+dstr(Math.round(x))+'</text>'});
  if(o.goal!=null)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(o.goal)+'" y2="'+Y(o.goal)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="'+(W-m.r)+'" y="'+(Y(o.goal)-5)+'" text-anchor="end" font-size="11" fill="var(--muted)">objectif</text>';
  const R=o.dot||3;
  if(o.lineRaw&&pts.length>1)g+='<path d="'+pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(p=>{g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+R+'" fill="var(--accent)" fill-opacity="'+(o.lineRaw?1:.35)+'" '+(o.lineRaw?'stroke="var(--surface)" stroke-width="2"':'')+'/>'});
  if(line.length>1)g+='<path d="'+line.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  const last=(line.length?line:pts).slice(-1)[0];
  g+='<circle cx="'+X(last.x).toFixed(1)+'" cy="'+Y(last.y).toFixed(1)+'" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>';
  g+='<g id="xh" visibility="hidden"><line y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--muted)" stroke-width="1"/><circle r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/></g>';
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Graphique')+'">'+g+'<rect x="'+m.l+'" y="0" width="'+(W-m.l-m.r)+'" height="'+H+'" fill="transparent" id="hit"/></svg>';
  const svg=el.firstChild,xh=svg.querySelector('#xh'),hit=svg.querySelector('#hit');
  const src=pts.length?pts:line;
  const pick=ev=>{
    const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W;
    let best=null,bd=1e9;for(const p of src){const d=Math.abs(X(p.x)-px);if(d<bd){bd=d;best=p}}
    if(!best)return;
    const ref=(line.find(l=>l.x===best.x))||best;
    xh.setAttribute('visibility','visible');
    xh.firstChild.setAttribute('x1',X(best.x));xh.firstChild.setAttribute('x2',X(best.x));
    xh.lastChild.setAttribute('cx',X(best.x));xh.lastChild.setAttribute('cy',Y(best.y));
    if(o.onPick)o.onPick(best,ref);
  };
  hit.addEventListener('pointerdown',pick);hit.addEventListener('pointermove',ev=>{if(ev.buttons||ev.pointerType==='mouse')pick(ev)});
}
const xToDate=x=>{const d=new Date(x*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};

/* ===== navigation ===== */
const TITLES={weight:'Poids',food:'Repas',gym:'Muscu',scan:'Scan'};
const VIEWS={};
let tab=S.ui&&TITLES[S.ui.tab]?S.ui.tab:'weight';
function render(){
  const app=$('#app');app.dataset.tab=tab;
  $('#title').innerHTML=esc(TITLES[tab])+'<span>.</span>';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===tab)));
  renderBehind();
  if(typeof syncRestBar==='function')syncRestBar();
}
function renderBehind(){const f=VIEWS[tab];if(f){const st=window.scrollY;$('#view').innerHTML=f();VIEWS[tab+'_after']&&VIEWS[tab+'_after']();}}
document.querySelector('.tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(tab===b.dataset.t){window.scrollTo({top:0,behavior:'smooth'});return}
  tab=b.dataset.t;S.ui.tab=tab;saveLocal();closeSheet();render();window.scrollTo(0,0);
});
/* ===== WEIGHT ===== */
let wRange=30,wDate=null,wVal=null,wAll=false;
const sortedW=()=>Object.keys(S.weights).sort().map(d=>({d,x:dn(d),y:S.weights[d]}));
function movAvg(arr){return arr.map(p=>{const w=arr.filter(q=>q.x<=p.x&&q.x>p.x-7);return{x:p.x,y:w.reduce((s,q)=>s+q.y,0)/w.length}})}
function slopePerDay(arr){
  if(arr.length<4)return null;
  const n=arr.length,mx=arr.reduce((s,p)=>s+p.x,0)/n,my=arr.reduce((s,p)=>s+p.y,0)/n;
  let a=0,b=0;arr.forEach(p=>{a+=(p.x-mx)*(p.y-my);b+=(p.x-mx)*(p.x-mx)});
  return b?a/b:null;
}
const sgn=(v,d=1)=>(v>0?'+':v<0?'−':'')+nf(Math.abs(v),d);

/* progress ring toward the goal weight, one segment per step (default 2.5 kg) */
function milestones(start,goal,step){
  const dir=start>goal?-1:1,out=[],n=Math.floor(Math.abs(start-goal)/step+1e-9);
  for(let k=n;k>=1;k--){const v=goal-dir*k*step;if(dir<0?v<start-1e-6:v>start+1e-6)out.push(Math.round(v*100)/100)}
  out.push(goal);return out;
}
function arcPath(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos((a-90)*Math.PI/180),cy+r*Math.sin((a-90)*Math.PI/180)];
  const [x0,y0]=p(a0),[x1,y1]=p(a1);return 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+((a1-a0)>180?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2);
}
function ringCard(arr){
  const g=S.settings.goalW,step=S.settings.step||2.5;
  if(!g)return '';
  if(!arr.length)return '<div class="card"><h2>Objectif '+nf(g)+' kg</h2><div class="muted small">Enregistre ta première pesée : le cercle se remplit à chaque palier de '+nf(step)+' kg.</div></div>';
  const start=S.settings.startW||arr[0].y,cur=arr[arr.length-1].y;
  const dir=start>g?-1:1,total=Math.abs(start-g);
  if(total<0.05)return '';
  const prog=clamp(dir<0?start-cur:cur-start,0,total);
  const ms=milestones(start,g,step),bounds=[start].concat(ms);
  const N=ms.length,gap=N>1?6:0,avail=360-gap*N,C=140,R=88;
  const pt=(ang,r)=>[C+r*Math.cos((ang-90)*Math.PI/180),C+r*Math.sin((ang-90)*Math.PI/180)];
  let a=gap/2,cum=0,reached=0,tracks='',fills='',ticks='',labels='',markerAng=null;
  const nextI=ms.findIndex(v=>dir<0?cur>v+0.05:cur<v-0.05),next=nextI<0?null:ms[nextI];
  for(let i=0;i<N;i++){
    const len=Math.abs(bounds[i+1]-bounds[i]),ang=len/total*avail,f=clamp((prog-cum)/len,0,1);
    tracks+='<path d="'+arcPath(C,C,R,a,a+ang)+'" fill="none" stroke="var(--surface2)" stroke-width="16" stroke-linecap="round"/>';
    if(f>0.001)fills+='<path d="'+arcPath(C,C,R,a,a+Math.max(ang*f,0.6))+'" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round"/>';
    if(markerAng==null&&prog<=cum+len+1e-9)markerAng=a+ang*clamp((prog-cum)/len,0,1);
    const ok=f>=0.999,isNext=i===nextI,last=i===N-1,bA=a+ang+gap/2,[tx,ty]=pt(bA,R);
    if(ok)reached++;
    ticks+='<circle cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'" r="'+(last?9:7)+'" fill="'+(ok?'var(--accent)':'var(--surface)')+'" stroke="'+(ok?'var(--surface)':isNext?'var(--accent)':'var(--muted)')+'" stroke-width="'+(ok?3:isNext?3.5:2)+'"/>';
    const v=nf(bounds[i+1],2),col=ok?'var(--accent)':isNext?'var(--ink)':'var(--muted)',fw=ok||isNext||last?800:600;
    if(last)labels+='<text x="'+C+'" y="'+(C-R-21)+'" text-anchor="middle" font-size="14" font-weight="800" fill="'+col+'" class="num">'+v+' kg</text>';
    else{const [lx,ly]=pt(bA,R+27);labels+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4.5).toFixed(1)+'" text-anchor="middle" font-size="13" font-weight="'+fw+'" fill="'+col+'" class="num">'+v+'</text>'}
    cum+=len;a+=ang+gap;
  }

  const [mx,my]=pt(markerAng==null?0:markerAng,R);

  const done=prog>=total-0.05,pct=Math.round(prog/total*100),left=next==null?0:Math.abs(cur-next);
  const chips=ms.map((v,i)=>{const ok=dir<0?cur<=v+0.05:cur>=v-0.05;return '<span class="pal'+(ok?' ok':i===nextI?' next':'')+'">'+(ok?'✓ ':'')+nf(v,2)+'</span>'}).join('');
  return `<div class="card"><div class="row sb" style="margin-bottom:2px"><h2 style="margin:0">Objectif ${nf(g)} kg</h2><span class="pill neutral">${reached} / ${N} paliers</span></div>

  <div class="pals">${chips}</div></div>`;
}

/* ===== ACTIVITÉ DU JOUR : pas, dépense, apport ===== */
const actOf=d=>S.act[d]||{s:0,k:0};
function setAct(d,s,k){
  if(!s&&!k)delete S.act[d];else S.act[d]={s:Math.round(s)||0,k:Math.round(k)||0};
  persist('act');
}
const eatenOn=d=>Math.round(totals(dayEntries(d)).kcal);
function actCard(){
  const d=actDate||today(),a=actOf(d),eaten=eatenOn(d),goalS=S.settings.steps||10000;
  const bal=a.k-eaten,hasK=a.k>0,hasE=eaten>0;
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(d,-i));
  const mx=Math.max(goalS,...days.map(x=>actOf(x).s))||1;
  const bars=days.map(x=>{
    const v=actOf(x).s,h=Math.max(v?6:2,Math.round(v/mx*52));
    return `<div class="abar"><i style="height:${h}px;background:${v?'var(--accent)':'var(--line)'}"></i><span>${parseD(x).toLocaleDateString('fr-FR',{weekday:'narrow'})}</span></div>`;
  }).join('');
  const sPct=clamp(a.s/goalS*100,0,100);
  const full=hasK&&hasE;
  const balTxt=full?`<div style="text-align:right;white-space:nowrap"><div class="small muted">Balance</div><b class="num" style="font:800 20px/1.1 var(--font-display)">${bal>0?'−':bal<0?'+':''}${nf(Math.abs(bal),0)} kcal</b></div>`:'';
  const balHint=full?`<div class="small muted" style="margin-top:10px">${bal>0?'Tu as dépensé '+nf(bal,0)+' kcal de plus que ce que tu as mangé.':bal<0?'Tu as mangé '+nf(-bal,0)+' kcal de plus que ta dépense affichée.':'Apport et dépense à l’équilibre.'}</div>`
    :`<div class="small muted" style="margin-top:10px">${hasK?'Note tes repas dans l’onglet Repas pour voir la balance du jour.':'Saisis ta dépense pour voir la balance du jour.'}</div>`;
  return `<div class="card">
  <div class="row sb" style="margin-bottom:12px"><h2 style="margin:0">Journée</h2>
    <label class="chip" style="position:relative">${d===today()?'Aujourd’hui':esc(fmtShort(d))}
      <input type="date" data-ch="actdate" value="${d}" max="${today()}" aria-label="Jour affiché" style="position:absolute;inset:0;opacity:0;width:100%;height:100%">
    </label></div>
  <button class="actgrid" data-act="act-edit" aria-label="Modifier les pas et la dépense du jour">
    <div class="stat"><span>Pas</span><b>${a.s?nf(a.s,0):'—'}</b><span>sur ${nf(goalS,0)}</span></div>
    <div class="stat"><span>Dépensées</span><b>${hasK?nf(a.k,0):'—'}</b><span>kcal</span></div>
    <div class="stat"><span>Mangées</span><b>${hasE?nf(eaten,0):'—'}</b><span>kcal</span></div>
  </button>
  <div class="bar" style="margin:12px 0 4px"><i style="width:${sPct}%"></i></div>
  <div class="small muted" style="margin-bottom:14px">${a.s?nf(sPct,0)+' % de ton objectif de pas':'Saisis tes pas depuis Step Counter Pedometer.'}</div>
  <div class="row sb" style="align-items:flex-end;gap:12px;margin-bottom:14px"><div class="abars">${bars}</div>${balTxt}</div>
  <button class="btn soft block" data-act="act-edit">${a.s||a.k?'Modifier la journée':'Saisir mes pas'}</button>
  ${balHint}</div>`;
}

],[150,"g","coulis de tomate"],[70,"g","boulgour cru"],[100,"g","courgette"],[10,"g","parmesan rape"]],"st":["Mélange la dinde hachée avec le parmesan, du sel, du poivre et des herbes, puis forme 6 petites boulettes.","Fais-les dorer 5 minutes à la poêle antiadhésive en les roulant.","Ajoute la courgette en dés et le coulis, laisse mijoter 10 minutes à couvert.","Cuis le boulgour 10 minutes dans de l’eau bouillante salée et sers avec les boulettes."],"tip":"Les boulettes se congèlent crues, bien séparées sur une plaque."},{"id":"shakshuka","n":"Shakshuka aux pois chiches","s":["lu","di","bk"],"t":25,"k":535,"p":35.2,"c":51.0,"f":20.3,"veg":1,"prep":0,"ing":[[3,"","œuf|œufs"],[200,"g","coulis de tomate"],[100,"g","poivron"],[60,"g","oignon"],[80,"g","pois chiches égouttés"],[1,"tranche|tranches","pain complet"]],"st":["Fais revenir l’oignon et le poivron en dés 5 minutes dans une poêle avec couvercle.","Ajoute le coulis, les pois chiches, du cumin et du paprika, laisse mijoter 8 minutes.","Creuse trois petits puits, casse un œuf dans chacun, couvre et laisse cuire 5 à 6 minutes, jusqu’à ce que le blanc soit pris.","Sers avec le pain grillé pour tremper."],"tip":""},{"id":"cesar","n":"Salade César allégée au poulet","s":["lu","di"],"t":20,"k":385,"p":49.4,"c":15.9,"f":12.3,"veg":0,"prep":0,"ing":[[150,"g","blanc de poulet cru"],[100,"g","salade verte"],[0.6,"tranche|tranches","pain complet"],[15,"g","parmesan rape"],[60,"g","yaourt grec 0 %"],[1,"càc","huile d’olive"],[80,"g","tomate"]],"st":["Fais dorer le poulet en lamelles avec l’huile, 6 à 8 minutes, puis laisse-le tiédir.","Coupe le pain en petits cubes et fais-les griller à la poêle sèche pour faire des croûtons.","Mélange le yaourt grec avec le parmesan râpé, un peu de citron, de moutarde et de l’ail en poudre : c’est la sauce.","Assemble la salade, le poulet, les tomates et les croûtons, puis nappe de sauce."],"tip":""},{"id":"steak_pdt","n":"Steak haché, pommes de terre rôties et haricots verts","s":["lu","di"],"t":35,"k":425,"p":39.5,"c":48.5,"f":8.1,"veg":0,"prep":0,"ing":[[150,"g","bœuf haché 5 %"],[250,"g","pommes de terre"],[150,"g","haricots verts"]],"st":["Chauffe le four à 210 °C. Coupe les pommes de terre en quartiers, sel, paprika, et enfourne 30 minutes sur du papier cuisson.","Cuis les haricots verts 8 minutes dans l’eau bouillante.","Forme un steak avec le bœuf et fais-le cuire 3 à 4 minutes de chaque côté dans une poêle sans matière grasse.","Sers avec une pointe de moutarde."],"tip":""},{"id":"poulet_tikka","n":"Poulet façon tikka au yaourt, riz et concombre","s":["lu","di"],"t":30,"k":509,"p":48.2,"c":58.7,"f":7.8,"veg":0,"prep":1,"ing":[[150,"g","blanc de poulet cru"],[80,"g","yaourt grec 0 %"],[70,"g","riz basmati cru"],[80,"g","concombre"],[1,"càc","huile d’olive"]],"st":["Mélange le yaourt avec une cuillère à café de curry, de paprika, de l’ail, du sel et du citron. Plonge le poulet en cubes dedans (15 minutes minimum, ou toute la nuit).","Fais dorer le poulet à la poêle avec l’huile, 8 minutes, en le retournant.","Cuis le riz ; coupe le concombre en dés.","Sers le poulet sur le riz avec le concombre."],"tip":"Mariné la veille, il est encore plus tendre."},{"id":"oeufs_saumon","n":"Œufs brouillés au saumon fumé","s":["bk","lu"],"t":10,"k":508,"p":36.1,"c":32.5,"f":24.9,"veg":0,"prep":0,"ing":[[3,"","œuf|œufs"],[40,"g","saumon fumé"],[2,"tranche|tranches","pain complet"],[1,"càs","crème légère 15 %"]],"st":["Bats les œufs avec la crème, du sel et du poivre.","Verse dans une poêle antiadhésive à feu doux et remue sans cesse avec une spatule : ils doivent rester crémeux, 3 à 4 minutes.","Fais griller le pain.","Pose les œufs sur les tartines, ajoute le saumon fumé en lanières et un peu d’aneth ou de ciboulette."],"tip":"Retire la poêle du feu quand les œufs sont encore un peu humides : ils finissent de cuire tout seuls."},{"id":"pain_perdu","n":"Pain perdu protéiné aux fruits rouges","s":["bk","sn"],"t":12,"k":488,"p":34.2,"c":51.9,"f":14.6,"veg":1,"pre /* ===== RECETTES : sous-onglets « Recettes » et « Déjà faites » du Repas =====
   Les recettes viennent de RECIPES (js2c.js, généré) + S.recipes.mine (les siennes).
   S.recipes = { done:{ id:{n,last} }, notes:{ id:texte }, mine:[ recette ] }.
   Classées selon ce qu'il reste de la journée affichée (fDate) : calories,
   protéines, glucides, lipides. */
const RC=()=>{const r=S.recipes||(S.recipes={});r.done=r.done||{};r.notes=r.notes||{};r.mine=r.mine||[];return r};
const allRecipes=()=>RECIPES.concat(RC().mine);
const recipeById=id=>allRecipes().find(r=>r.id===id);
const SLOT_SHORT={bk:'Petit-déj.',lu:'Déjeuner',di:'Dîner',sn:'Collation'};
const SLOT_TO={bk:'au petit-déjeuner',lu:'au déjeuner',di:'au dîner',sn:'aux collations'};
const SLOT_W={bk:.25,lu:.35,di:.3,sn:.1};   /* poids d'un repas dans la journée */
let rcSlot='all',rcFast=false,rcPrep=false,rcVeg=false,rcOpenId=null,rcK=1,rcAdd='lu',rcEditId=null,rcFormSlot='lu';

/* ---- ce qu'il reste, et ce qui convient le mieux ---- */
function rcRem(){
  const g=goals(),t=totals(dayEntries(fDate));
  return{k:g.kcal-t.kcal,p:g.p-t.p,c:g.c-t.c,f:g.f-t.f};
}
/* Part du reste de la journée qu'un repas de ce type devrait couvrir : on divise
   le reste entre les repas pas encore saisis (plus celui-ci). */
function rcTarget(rem,slot){
  const filled=new Set(dayEntries(fDate).map(e=>e.slot));
  let sum=SLOT_W[slot];
  for(const s in SLOT_W)if(s!==slot&&!filled.has(s))sum+=SLOT_W[s];
  const sh=SLOT_W[slot]/sum,pos=v=>Math.max(0,v)*sh;
  return{k:pos(rem.k),p:pos(rem.p),c:pos(rem.c),f:pos(rem.f)};
}
/* Prochain repas à viser quand aucun filtre n'est choisi : celui de l'heure s'il
   n'est pas encore saisi, sinon le suivant ; un jour passé commence au petit-déjeuner. */
function rcNextSlot(){
  const filled=new Set(dayEntries(fDate).map(e=>e.slot)),h=new Date().getHours(),order=['bk','lu','di'];
  const i=order.indexOf(fDate!==today()?'bk':h<11?'bk':h<16?'lu':'di');
  for(let n=0;n<3;n++){const s=order[(i+n)%3];if(!filled.has(s))return s}
  return 'sn';
}
const rcSlotOf=r=>rcSlot==='all'?rcNextSlot():r.s.includes(rcSlot)?rcSlot:r.s[0];
/* Plus c'est bas, mieux c'est. Les protéines en dessous de la cible coûtent cher,
   au-dessus presque rien : on veut des repas protéinés. */
function rcScore(r,rem){
  const t=rcTarget(rem,rcSlotOf(r)),rel=(a,b,m)=>Math.abs(a-b)/Math.max(b,m);
  const dp=r.p>=t.p?.4*(r.p-t.p)/Math.max(t.p,15):1.5*(t.p-r.p)/Math.max(t.p,15);
  const hors=rcSlot==='all'&&!r.s.includes(rcSlotOf(r))?.35:0;   /* pas prévue pour ce repas */
  return dp+1.2*rel(r.k,t.k,150)+.6*rel(r.c,t.c,20)+.6*rel(r.f,t.f,8)+hors;
}
/* Ce qui dépasse du reste de la journée (avec un peu de tolérance). */
function rcOver(r,rem){
  const o=[],x=(v,u)=>'+'+nf(Math.round(v),0)+u;
  if(r.k>rem.k+30)o.push({w:(r.k-rem.k)/100,t:x(r.k-rem.k,' kcal en trop')});
  if(r.f>rem.f+4)o.push({w:(r.f-rem.f)/8,t:x(r.f-rem.f,' g de lipides en trop')});
  if(r.c>rem.c+8)o.push({w:(r.c-rem.c)/20,t:x(r.c-rem.c,' g de glucides en trop')});
  return o;   /* dans l'ordre d'importance pour l'affichage : calories, lipides, glucides */
}

/* ---- liste ---- */
function rcRow(r,rem,withDone){
  const over=rcOver(r,rem),d=RC().done[r.id],note=RC().notes[r.id];
  const pills=(over.length?`<span class="pill warn">${over[0].t}</span>`:'<span class="pill good">Tient dans ton reste</span>')
    +(d&&d.n?`<span class="pill neutral">✓ Faite ${d.n}×</span>`:'')
    +(!over.length&&rem.p>5&&!(d&&d.n)?`<span class="pill neutral">${Math.min(100,Math.round(r.p/rem.p*100))} % des protéines restantes</span>`:'');
  return `<button class="li" data-act="rc-open" data-id="${esc(r.id)}"><div class="grow">
    <div class="t">${esc(r.n)}</div>
    <div class="small muted">${r.t} min · P ${nf(r.p,0)} · G ${nf(r.c,0)} · L ${nf(r.f,0)}${r.mine?' · Ma recette':''}</div>
    ${withDone&&d?`<div class="small muted">Dernière fois : ${esc(fmtShort(d.last))}${note?' · « '+esc(note.length>60?note.slice(0,58)+'…':note)+' »':''}</div>`:''}
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:5px">${pills}</div></div>
    <div style="text-align:right;flex:none"><b class="num" style="font-size:19px">${nf(r.k,0)}</b><div class="small muted">kcal</div></div></button>`;
}
function rcBanner(rem){
  const stat=(l,v)=>`<div class="stat"><b class="num"${v<0?' style="color:var(--bad)"':''}>${v<0?'−':''}${nf(Math.abs(v),0)}</b><span>${l}</span></div>`;
  return `<div class="card"><h2>Il te reste ${fDate===today()?'aujourd’hui':'le '+esc(fmtShort(fDate))}</h2>
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">${stat('kcal',rem.k)}${stat('prot. (g)',rem.p)}${stat('gluc. (g)',rem.c)}${stat('lip. (g)',rem.f)}</div>
    <div class="small muted" style="margin-top:12px">${rem.k<=0?'Tu as atteint ton objectif de calories : voici les recettes les plus légères.':'Classées pour '+(rcSlot==='all'?'ton prochain repas ('+SLOT_SHORT[rcNextSlot()].toLowerCase()+')':'le choix « '+SLOT_SHORT[rcSlot].toLowerCase()+' »')+' : les mieux adaptées à ce reste d’abord.'}</div></div>`;
}
function recipesView(){
  if(foodSub==='done')return doneView();
  const rem=rcRem();
  let list=allRecipes().filter(r=>(rcSlot==='all'||r.s.includes(rcSlot))&&(!rcFast||r.t<=15)&&(!rcPrep||r.prep)&&(!rcVeg||r.veg))
    .map(r=>({r,o:rcOver(r,rem),sc:rcScore(r,rem)}));
  const exc=x=>x.o.reduce((s,y)=>s+y.w,0);
  list.sort((a,b)=>{const ao=a.o.length>0,bo=b.o.length>0;if(ao!==bo)return ao?1:-1;return ao?(exc(a)-exc(b)||a.sc-b.sc):a.sc-b.sc});
  const chip=(k,label,on)=>`<button class="chip" data-act="rc-flag" data-k="${k}" aria-pressed="${on}">${label}</button>`;
  const slots=[['all','Tous'],['bk','Petit-déj.'],['lu','Déjeuner'],['di','Dîner'],['sn','Collation']]
    .map(([k,n])=>`<button role="tab" data-act="rc-slot" data-s="${k}" aria-selected="${rcSlot===k}">${n}</button>`).join('');
  const flags=chip('fast','Rapide ≤ 15 min',rcFast)+chip('prep','À l’avance',rcPrep)+chip('veg','Végétarien',rcVeg);
  return dateBar()+rcBanner(rem)+
    `<div class="seg rcslotseg" role="tablist" aria-label="Repas" style="margin-bottom:10px">${slots}</div>
     <div class="chips">${flags}</div>`+
    (list.length?`<div class="card"><h2>${list.length} recette${list.length>1?'s':''}</h2><div class="list">${list.map(x=>rcRow(x.r,rem)).join('')}</div></div>`
      :'<div class="card empty">Aucune recette avec ces filtres.</div>')+
    `<button class="btn ghost block" data-act="rc-new" style="margin-bottom:14px">${ICON.plus} Ajouter ma recette</button>
     <div class="small muted" style="margin-bottom:14px">Valeurs par portion, calculées à partir de valeurs moyennes : elles sont indicatives.</div>`;
}
function doneView(){
  const rem=rcRem(),d=RC().done;
  const list=allRecipes().filter(r=>d[r.id]&&d[r.id].n>0).sort((a,b)=>(d[b.id].last||'').localeCompare(d[a.id].last||''));
  return dateBar()+(list.length
    ?`<div class="card"><h2>${list.length} recette${list.length>1?'s':''} déjà faite${list.length>1?'s':''}</h2><div class="list">${list.map(r=>rcRow(r,rem,true)).join('')}</div></div>`
    :'<div class="card empty">Rien pour l’instant.<br>Ouvre une recette et appuie sur « Je l’ai préparée » : elle apparaît ici, avec la date et ta note.</div>');
}
A['rc-slot']=b=>{rcSlot=b.dataset.s;render()};
A['rc-flag']=b=>{const k=b.dataset.k;if(k==='fast')rcFast=!rcFast;else if(k==='prep')rcPrep=!rcPrep;else rcVeg=!rcVeg;render()};

/* ---- fiche d'une recette ---- */
const frac=v=>{
  v=Math.round(v*4)/4;const w=Math.floor(v),f=v-w;
  const s=f===.25?'¼':f===.5?'½':f===.75?'¾':'';
  return (w||!s?String(w):'')+(w&&s?' ':'')+s;
};
const rcPl=(s,n)=>{const p=s.split('|');return n>1?(p[1]||p[0]):p[0]};
const rcDe=n=>(/^(huile|[aeiouéèêâîôœ])/i.test(n)?'d’':'de ')+n;
function rcIng(r,k){
  if(r.ingTxt)return r.ingTxt.map(l=>`<li>${esc(l)}</li>`).join('')||'<li class="muted">Pas d’ingrédients notés.</li>';
  return r.ing.map(([q,u,n])=>{
    const v=q*k;
    if(u==='g'||u==='ml')return `<li>${nf(Math.round(v),0)} ${u} ${esc(rcDe(n))}</li>`;
    if(u==='')return `<li>${frac(v)} ${esc(rcPl(n,v))}</li>`;
    return `<li>${frac(v)} ${esc(rcPl(u,v))} ${esc(rcDe(n.split('|')[0]))}</li>`;
  }).join('');
}
function rcSheet(){
  const r=recipeById(rcOpenId);if(!r)return;
  const note=RC().notes[r.id]||'';
  openSheet(`<div class="rc"><h3>${esc(r.n)}</h3>
  <div class="row" style="flex-wrap:wrap;gap:6px;margin:-6px 0 14px"><span class="pill neutral">⏱ ${r.t} min</span>${r.veg?'<span class="pill good">Végétarien</span>':''}${r.prep?'<span class="pill neutral">À préparer à l’avance</span>':''}${r.mine?'<span class="pill neutral">Ma recette</span>':''}</div>
  <div class="sec">Portions</div>
  <div class="seg" id="rcseg" role="tablist" aria-label="Nombre de portions">${[[.5,'½'],[1,'1'],[1.5,'1,5'],[2,'2']].map(([k,n])=>`<button role="tab" data-act="rc-k" data-k="${k}" aria-selected="${rcK===k}">${n}</button>`).join('')}</div>
  <div class="stats" id="rcstats" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px"></div>
  <div class="sec">Ingrédients</div>
  <ul class="rcl" id="rcing"></ul>
  <div class="sec">Préparation</div>
  <ol class="rcl">${r.st.length?r.st.map(s=>`<li>${esc(s)}</li>`).join(''):'<li class="muted">Pas d’étapes notées.</li>'}</ol>
  ${r.tip?`<div class="card" style="box-shadow:none;background:var(--surface2)"><b>Astuce</b><div style="margin-top:4px">${esc(r.tip)}</div></div>`:''}
  <div class="sec" style="margin-top:6px">Ajouter au journal</div>
  <div class="seg rcslotseg" id="rcslots" role="tablist" aria-label="Repas du journal"></div>
  <button class="btn block" id="rcaddbtn" data-act="rc-log"></button>
  <div id="rcmade" style="margin-top:12px"></div>
  <div class="field" style="margin-top:16px"><label for="rcnote">Ma note</label><textarea class="inp" id="rcnote" data-ch="rcnote" placeholder="Ex : un peu moins de sel, ajouter du piment…">${esc(note)}</textarea></div>
  ${r.mine?'<div class="grid2"><button class="btn ghost" data-act="rc-edit">Modifier</button><button class="btn danger" data-act="rc-del">Supprimer</button></div>':''}
  <div class="small muted" style="margin-top:14px">Valeurs indicatives. Poids crus pour les viandes, poissons, féculents et lentilles ; conserves égouttées.</div></div>`);
  rcDraw();
}
/* Met à jour les morceaux qui dépendent des portions, sans refaire toute la fiche
   (sinon elle remonterait en haut à chaque appui). */
function rcDraw(){
  const r=recipeById(rcOpenId);if(!r||!$('#rcstats'))return;
  const k=rcK,d=RC().done[r.id];
  $('#rcstats').innerHTML=[['kcal',r.k],['prot. (g)',r.p],['gluc. (g)',r.c],['lip. (g)',r.f]].map(([l,v])=>`<div class="stat"><b class="num">${nf(v*k,0)}</b><span>${l}</span></div>`).join('');
  $('#rcing').innerHTML=rcIng(r,k);
  document.querySelectorAll('#rcseg button').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.k)===k)));
  $('#rcslots').innerHTML=SLOTS.map(([s])=>`<button role="tab" data-act="rc-addslot" data-s="${s}" aria-selected="${rcAdd===s}">${SLOT_SHORT[s]}</button>`).join('');
  $('#rcaddbtn').textContent='Ajouter à '+(fDate===today()?'aujourd’hui':fmtShort(fDate))+' · '+nf(r.k*k,0)+' kcal';
  $('#rcmade').innerHTML=d&&d.n
    ?`<div class="card" style="box-shadow:none;background:var(--surface2);margin:0 0 10px"><b>✓ Préparée ${d.n} fois</b><div class="small muted">Dernière fois : ${esc(fmtLong(d.last))}</div></div>
      <div class="grid2"><button class="btn soft" data-act="rc-made">+ Refaite aujourd’hui</button><button class="btn ghost" data-act="rc-unmade">Retirer des faites</button></div>`
    :'<button class="btn soft block" data-act="rc-made">✓ Je l’ai préparée</button>';
}
function rcMark(id,date){
  const dn=RC().done,d=dn[id]||(dn[id]={n:0,last:''});
  if(d.n&&d.last===date)return false;
  d.n++;if(date>d.last)d.last=date;persist('recipes');return true;
}
A['rc-open']=b=>{
  const r=recipeById(b.dataset.id);if(!r)return;
  rcOpenId=r.id;rcK=1;rcAdd=rcSlot!=='all'&&r.s.includes(rcSlot)?rcSlot:r.s[0];rcSheet();
};
A['rc-k']=b=>{rcK=Number(b.dataset.k);rcDraw()};
A['rc-addslot']=b=>{rcAdd=b.dataset.s;rcDraw()};
A['rc-log']=()=>{
  const r=recipeById(rcOpenId);if(!r)return;const k=rcK;
  addEntry(rcAdd,{name:r.n+(k===1?'':k===.5?' (½ portion)':' ('+nf(k)+' portions)'),kcal:r.k*k,p:r.p*k,c:r.c*k,f:r.f*k});
  rcMark(r.id,fDate);closeSheet();toast('Ajouté '+SLOT_TO[rcAdd]);render();
};
A['rc-made']=()=>{
  if(!rcMark(rcOpenId,today())){toast('Déjà noté pour aujourd’hui');return}
  toast('Noté dans tes recettes faites');rcDraw();render();
};
A['rc-unmade']=()=>{delete RC().done[rcOpenId];persist('recipes');toast('Retirée des recettes faites');rcDraw();render()};
I.rcnote=t=>{
  if(!rcOpenId)return;const n=RC().notes,v=t.value.trim();
  if(v)n[rcOpenId]=v;else delete n[rcOpenId];
  persist('recipes');render();
};

/* ---- ses propres recettes ---- */
function rcForm(r){
  rcEditId=r?r.id:null;rcFormSlot=r?r.s[0]:'lu';
  const v=r||{n:'',t:'',k:'',p:'',c:'',f:'',ingTxt:[],st:[]};
  openSheet(`<div class="rc"><h3>${r?'Modifier ma recette':'Ma recette'}</h3>
  <div class="field"><label for="rfn">Nom</label><input class="inp" id="rfn" value="${esc(v.n)}" placeholder="Ex : Poulet au curry de maman"></div>
  <div class="sec">Repas</div>
  <div class="seg" id="rfseg" role="tablist">${SLOTS.map(([s])=>`<button role="tab" data-act="rc-fslot" data-s="${s}" aria-selected="${rcFormSlot===s}">${SLOT_SHORT[s]}</button>`).join('')}</div>

A['rc-save']=()=>{
  const n=$('#rfn').value.trim(),k=num($('#rfk').value);
  if(!n||!k){toast('Indique un nom et les calories');return}
  const lines=id=>$('#'+id).value.split('\n').map(x=>x.trim()).filter(Boolean),m=RC().mine,i=m.findIndex(x=>x.id===rcEditId);
  const o=Object.assign({veg:0,prep:0,tip:''},i>=0?m[i]:{},{
    id:i>=0?rcEditId:'u_'+uid(),n,s:[rcFormSlot],t:Math.max(1,Math.round(num($('#rft').value))||15),
    k:Math.round(k),p:r1($('#rfp').value),c:r1($('#rfc').value),f:r1($('#rff').value),
    ingTxt:lines('rfi'),st:lines('rfs'),mine:1});
  if(i>=0)m[i]=o;else m.unshift(o);
  persist('recipes');rcOpenId=o.id;rcK=1;rcAdd=o.s[0];render();rcSheet();toast('Recette enregistrée');
};
A['rc-del']=()=>{
  const r=recipeById(rcOpenId);if(!r||!r.mine)return;
  confirmSheet('Supprimer cette recette ?','« '+r.n+' » disparaît de ta liste, avec ta note.','Supprimer',()=>{
    const s=RC();s.mine=s.mine.filter(x=>x.id!==r.id);delete s.done[r.id];delete s.notes[r.id];
    persist('recipes');rcOpenId=null;render();toast('Recette supprimée');
  });
};

/* ===== CHERCHER : aliments de base sans code-barres =====
   Premier onglet de la feuille « Ajouter » du Repas. Cherche dans FOODS (js2e.js,
   généré) sans tenir compte des accents ni des majuscules, puis demande la quantité
   (grammes, ou une unité usuelle : œuf, tranche, càs…) avec le calcul en direct. */
/* Sections : les memes que la bibliotheque du Scan (SLIB, js4b.js). Chaque aliment a une categorie « section.sous-section ». */
const foodCats=()=>[['top','Courants']].concat(SLIB.filter(c=>FOODS.some(f=>f.cat.split('.')[0]===c.id)).map(c=>[c.id,c.s]));
const normTxt=s=>String(s??'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'\-]/g,' ');
FOODS.forEach(f=>{f._k=normTxt(f.n+' '+(f.a||''))});
let bq='',bcat='top',bSel=null,bUnit=-1,bQty=100,bSlot='bk';   /* bUnit : -1 = grammes (ou ml), sinon rang dans f.u */

/* ---- recherche ---- */
function foodSearch(q){
  /* tous les mots doivent se trouver ; « oeufs » trouve « œuf » (pluriel retiré) */
  const t=normTxt(q).split(/\s+/).filter(Boolean).map(w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w);
  if(!t.length)return[];
  const res=[];
  for(const f of FOODS){
    let sc=0,ok=true;
    for(const w of t){
      const i=f._k.indexOf(w);
      if(i<0){ok=false;break}
      sc+=i===0?0:f._k[i-1]===' '?1:3;      /* début du nom, début d'un mot, ailleurs */
    }
    if(ok)res.push({f,sc:sc-(f.top?.5:0)});
  }
  return res.sort((a,b)=>a.sc-b.sc||a.f.n.length-b.f.n.length).slice(0,50).map(x=>x.f);
}
function foodList(){
  if(bq.trim())return foodSearch(bq);
  if(bcat==='top')return FOODS.filter(f=>f.top).sort((a,b)=>a.top-b.top);
  return FOODS.filter(f=>f.cat.split('.')[0]===bcat).sort((a,b)=>a.n.localeCompare(b.n,'fr'));
}
function foodRow(f){
  return `<button class="li" data-act="b-pick" data-id="${f.id}"><div class="grow"><div class="t">${esc(f.n)}</div><div class="small muted">P ${nf(f.p)} · G ${nf(f.c)} · L ${nf(f.f)} · pour 100 ${f.ml?'ml':'g'}</div></div><div style="text-align:right;flex:none"><b class="num" style="font-size:18px">${nf(f.k,0)}</b><div class="small muted">kcal</div></div></button>`;
}
function foodRows(){
  const list=foodList();
  if(!list.length)return '<div class="empty">Aucun aliment trouvé.<br>Ajoute-le à la main dans l’onglet « Manuel ».</div>';
  if(!bq.trim()&&bcat!=='top'){   /* une section : les aliments par sous-section */
    const sec=SLIB.find(c=>c.id===bcat);
    return (sec?sec.subs:[]).map(([k,n])=>{
      const l=list.filter(f=>f.cat===bcat+'.'+k);
      return l.length?`<div class="sec libsub">${esc(n)} <span class="muted">· ${l.length}</span></div><div class="list">${l.map(foodRow).join('')}</div>`:'';
    }).join('');
  }
  return '<div class="list">'+list.map(foodRow).join('')+'</div>';
}
function foodSearchHtml(slot){
  const chips=foodCats().map(([k,n])=>`<button class="chip" data-act="b-cat" data-k="${k}" aria-pressed="${!bq.trim()&&bcat===k}">${n}</button>`).join('');
  return `<div class="field"><input class="inp" type="search" id="bqin" data-in="bq" placeholder="Ex : œuf, riz, poulet…" value="${esc(bq)}" aria-label="Chercher un aliment" autocomplete="off"></div>
  <div class="chips" id="bchips">${chips}</div>
  <div id="bres">${foodRows()}</div>
  <div class="small muted" style="margin-top:12px">Valeurs moyennes pour 100 g, indicatives. Pour un produit de marque, utilise « Scanner ».</div>`;
}
/* Met à jour la liste et les puces sans refaire la feuille (le clavier reste ouvert). */
function foodRefresh(){
  const q=bq.trim();
  document.querySelectorAll('#bchips .chip').forEach(c=>c.setAttribute('aria-pressed',String(!q&&c.dataset.k===bcat)));
  const r=$('#bres');if(r)r.innerHTML=foodRows();
  const i=$('#bqin');if(i&&i.value!==bq)i.value=bq;
}
I.bq=t=>{bq=t.value;foodRefresh()};
A['b-cat']=b=>{bcat=b.dataset.k;bq='';foodRefresh()};

/* ---- quantité ---- */
const bBase=f=>f.ml?'ml':'g';
const bGrams=()=>bUnit<0?bQty:bQty*bSel.u[bUnit][1];
const bFmt=q=>Math.abs(q*4-Math.round(q*4))<1e-9?frac(q):nf(q,2);
/* Texte écrit dans le journal : « 2 œufs », « 150 g de riz basmati cuit », « 1 càs d’huile d’olive ». */
function bLabel(){
  const f=bSel,low=f.n.charAt(0).toLowerCase()+f.n.slice(1);
  if(bUnit<0)return nf(bQty,2)+' '+bBase(f)+' '+rcDe(low);
  const [lab,,self]=f.u[bUnit],q=bFmt(bQty)+' '+rcPl(lab,bQty);
  return self?q:q+' '+rcDe(low);
}
function bQuick(){
  const v=bUnit<0?(bSel.ml?[100,200,250,330]:[50,100,150,200,250]):[.5,1,2,3,4];
  return v.map(x=>`<button class="chip" data-act="b-q" data-v="${x}" aria-pressed="${bQty===x}">${bUnit<0?x:frac(x)}</button>`).join('');
}
function foodQtyHtml(){
  const f=bSel,units=[[-1,bBase(f)]].concat((f.u||[]).map((u,i)=>[i,u[0].split('|')[0]]));
  return `<button class="btn ghost" style="min-height:44px;margin-bottom:12px" data-act="b-back">${ICON.chevL} Retour</button>
  <div class="t" style="font:800 20px/1.2 var(--font-display);margin-bottom:2px">${esc(f.n)}</div>
  <div class="small muted" style="margin-bottom:14px">Pour 100 ${bBase(f)} : ${nf(f.k,0)} kcal · P ${nf(f.p)} · G ${nf(f.c)} · L ${nf(f.f)}</div>
  ${units.length>1?`<div class="seg rcslotseg" id="bunits" role="tablist" aria-label="Unité">${units.map(([i,n])=>`<button role="tab" data-act="b-unit" data-i="${i}" aria-selected="${bUnit===i}">${esc(n)}</button>`).join('')}</div>`:''}
  <div class="field"><label for="bqty">Quantité (<span id="bu">${esc(bUnit<0?bBase(f):f.u[bUnit][0].split('|')[1]||f.u[bUnit][0])}</span>)</label><input class="inp" id="bqty" data-in="bqty" inputmode="decimal" value="${String(bQty).replace('.',',')}"></div>
  <div class="chips" id="bquick">${bQuick()}</div>
  <div class="stats" id="bmac" style="grid-template-columns:repeat(4,1fr)"></div>
  <div class="small muted" id="bgrams" style="margin:8px 0 12px;min-height:18px"></div>
  <label class="row" style="margin:0 0 14px;min-height:44px"><input type="checkbox" id="bfav" style="width:22px;height:22px"> Garder dans mes favoris</label>
  <button class="btn block" id="badd" data-act="b-add"></button>`;
}
function bDraw(typing){
  const f=bSel;if(!f||!$('#bmac'))return;
  const g=bGrams(),m=x=>x*g/100;
  $('#bmac').innerHTML=[['kcal',m(f.k),0],['prot. (g)',m(f.p),1],['gluc. (g)',m(f.c),1],['lip. (g)',m(f.f),1]].map(([l,v,d])=>`<div class="stat"><b class="num">${nf(v,d)}</b><span>${l}</span></div>`).join('');
  $('#bgrams').textContent=bUnit<0?'':'= '+nf(g,0)+' '+bBase(f);
  const a=$('#badd');a.textContent='Ajouter · '+nf(m(f.k),0)+' kcal';a.disabled=!(bQty>0);
  document.querySelectorAll('#bunits button').forEach(b=>b.setAttribute('aria-selected',String(Number(b.dataset.i)===bUnit)));
  $('#bquick').innerHTML=bQuick();
  $('#bu').textContent=bUnit<0?bBase(f):f.u[bUnit][0].split('|')[1]||f.u[bUnit][0];
  if(!typing)$('#bqty').value=String(bQty).replace('.',',');
}
A['b-pick']=b=>{
  const f=FOODS.find(x=>x.id===b.dataset.id);if(!f)return;
  bSel=f;
  if(f.u&&f.u.length){bUnit=0;bQty=1}else{bUnit=-1;bQty=f.ml?200:100}
  addSheet(bSlot);bDraw();
};
A['b-back']=()=>{bSel=null;addSheet(bSlot)};
A['b-unit']=b=>{
  /* on garde la même quantité en grammes : 2 œufs deviennent 110 g */
  const g=bGrams(),i=Number(b.dataset.i);bUnit=i;
  bQty=i<0?Math.round(g):Math.max(.25,Math.round(g/bSel.u[i][1]*4)/4);
  bDraw();
};
A['b-q']=b=>{bQty=Number(b.dataset.v);bDraw()};
I.bqty=t=>{bQty=num(t.value);bDraw(true)};
A['b-add']=()=>{
  const f=bSel;if(!f||!(bQty>0))return;
  const g=bGrams(),m=x=>x*g/100,e={name:bLabel(),kcal:m(f.k),p:m(f.p),c:m(f.c),f:m(f.f)};
  addEntry(bSlot,e);
  if($('#bfav')&&$('#bfav').checked){S.foods.unshift({id:uid(),name:e.name,kcal:r1(e.kcal),p:r1(e.p),c:r1(e.c),f:r1(e.f)});persist('foods')}
  bSel=null;closeSheet();toast('Ajouté : '+e.name);render();
};

function thumb(name,size){
  const id=ILL[name],st=size?'style="width:'+size+'px;height:'+size+'px"':'';
  return id?'<img class="thumb" '+st+' src="ill/'+id+'-t.webp" alt="" loading="lazy" decoding="async">':'<div class="thumb ph" '+st+' aria-hidden="true">'+esc((name||'?').trim().charAt(0).toUpperCase())+'</div>';
}

let gymTab='sessions',gymOpen=false,progEx=null,progMetric='top',exQuery='',restEnd=0;
const fmtKg=v=>nf(v,2);
const e1rm=(kg,reps)=>reps<=1?kg:kg*(1+reps/30);
const setVol=s=>num(s.kg)*num(s.reps);
const topSet=sets=>sets.reduce((b,s)=>!b||num(s.kg)>num(b.kg)||(num(s.kg)===num(b.kg)&&num(s.reps)>num(b.reps))?s:b,null);
const sessVol=ses=>ses.exercises.reduce((t,e)=>t+e.sets.reduce((u,s)=>u+setVol(s),0),0);
function lastPerf(name){
  for(const ses of S.sessions){const e=ses.exercises.find(x=>x.name===name);if(e)return e.sets}
  return null;
}
function history(name){
  const out=[];
  for(const ses of S.sessions.slice().reverse()){
    const e=ses.exercises.find(x=>x.name===name);if(!e||!e.sets.length)continue;
    const top=topSet(e.sets),best=e.sets.reduce((m,s)=>Math.max(m,e1rm(num(s.kg),num(s.reps))),0);
    out.push({date:ses.date,x:dn(ses.date),top,e1:best,vol:e.sets.reduce((t,s)=>t+setVol(s),0)});
  }
  return out;
}
function allExNames(){
  const set=new Set();LIB.forEach(g=>g[1].forEach(n=>set.add(n)));S.exercises.forEach(n=>set.add(n));
  S.sessions.forEach(s=>s.exercises.forEach(e=>set.add(e.name)));
  return [...set];
}
const mkSets=n=>Array.from({length:n},()=>({kg:'',reps:'',done:false}));
function startSession(name,exs){
  if(S.active){gymOpen=true;toast('Séance en cours reprise');render();return}
  S.active={id:uid(),name:name||'Séance',start:Date.now(),exercises:exs.map(e=>({name:e.name,sets:mkSets(e.sets||3).map(x=>({kg:e.kg?String(e.kg):'',reps:e.reps?String(e.reps):'',done:false}))}))};
  persist('active');gymOpen=true;restEnd=0;render();window.scrollTo(0,0);
}

  return seg+(gymTab==='sessions'?sessionsHome():progressView());
}

function sessionView(){
  const a=S.active;
  const exs=a.exercises.map((e,ei)=>{
    const prev=lastPerf(e.name)||[];
    const rows=e.sets.map((s,si)=>{
      const p=prev[si];
      return `<div class="r ${s.done?'done':''}" style="display:contents"><div class="n">${si+1}</div><div class="prev">${p?nf(num(p.kg),2)+' × '+nf(num(p.reps),0):'—'}</div>
      <input inputmode="decimal" data-in="set" data-e="${ei}" data-s="${si}" data-f="kg" value="${esc(s.kg)}" placeholder="${p?nf(num(p.kg),2):'kg'}" aria-label="Charge série ${si+1}">
      <input inputmode="numeric" data-in="set" data-e="${ei}" data-s="${si}" data-f="reps" value="${esc(s.reps)}" placeholder="${p?nf(num(p.reps),0):'reps'}" aria-label="Répétitions série ${si+1}">
      <button class="ck" data-act="g-check" data-e="${ei}" data-s="${si}" aria-pressed="${s.done}" aria-label="Série ${si+1} faite">${ICON.check}</button></div>`;
    }).join('');
    return `<div class="card ex"><div class="hd"><button class="thumbbtn" data-act="g-exinfo" data-name="${esc(e.name)}" aria-label="Voir l’exercice ${esc(e.name)}">${thumb(e.name,48)}</button><b style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(e.name)}</b><button class="iconbtn" style="width:40px;height:40px;box-shadow:none;background:var(--surface2)" data-act="g-exmenu" data-e="${ei}" aria-label="Options de l’exercice"><span style="font-size:20px;line-height:1">⋯</span></button></div>
    <div class="sets"><div class="h">#</div><div class="h">Avant</div><div class="h">kg</div><div class="h">Reps</div><div class="h">OK</div>${rows}</div>
    <button class="btn soft block" style="margin-top:12px;min-height:44px" data-act="g-addset" data-e="${ei}">${ICON.plus} Série</button></div>`;
  }).join('');
  return `<div class="row sb" style="margin-bottom:10px"><button class="chip" data-act="g-back">${ICON.chevL} Séances</button><span class="num" id="elapsed" style="font-weight:800;font-size:20px"></span><button class="btn" style="min-height:44px" data-act="g-finish">Terminer</button></div>
  <div class="field"><input class="inp" data-in="sname" value="${esc(a.name)}" aria-label="Nom de la séance" style="font-weight:700"></div>
  ${exs||'<div class="card empty">Ajoute ton premier exercice.</div>'}
  <button class="btn block" data-act="g-addex">${ICON.plus} Ajouter un exercice</button>
  <button class="btn danger block" style="margin-top:10px" data-act="g-cancel">Abandonner la séance</button>`;
}
function tick(){
  const a=S.active,el=$('#elapsed');
  if(a&&el){const s=Math.floor((Date.now()-a.start)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);el.textContent=(h?h+':'+pad(m):m)+':'+pad(s%60)}
  if(typeof syncRestBar==='function')syncRestBar();
}

A['g-check']=b=>{
  const a=S.active,e=a.exercises[+b.dataset.e],s=e.sets[+b.dataset.s];
  if(!s.done){
    const p=(lastPerf(e.name)||[])[+b.dataset.s];
    if(s.kg===''&&p)s.kg=String(num(p.kg));
    if(s.reps===''&&p)s.reps=String(num(p.reps));
    if(s.reps===''||num(s.reps)<=0){toast('Indique les répétitions');return}
    if(s.kg==='')s.kg='0';
    s.done=true;startRest(S.settings.rest);
  }else s.done=false;
  persist('active');render();
};

/* exercise picker */
function exPicker(){
  const q=exQuery.toLowerCase().trim(),all=allExNames();
  const tgt=routEdit&&!(S.active&&gymOpen)?curRoutine():S.active;
  const used=new Set(tgt?tgt.exercises.map(e=>e.name):[]);
  const row=n=>{const e=EXI[n];return `<button class="li" data-act="g-pickex" data-name="${esc(n)}" ${used.has(n)?'style="opacity:.5"':''}>${thumb(n)}<div class="grow"><div class="t">${esc(n)}</div>${e?'<div class="small muted">'+esc(e.m.join(', '))+'</div>':''}</div>${used.has(n)?'<span class="small muted">ajouté</span>':''}</button>`};
  const create=q&&!all.some(n=>n.toLowerCase()===q)?`<button class="btn soft block" style="margin-bottom:10px" data-act="g-newex" data-name="${esc(exQuery.trim())}">${ICON.plus} Créer « ${esc(exQuery.trim())} »</button>`:'';
  if(q){const names=all.filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,'fr'));return create+'<div class="list">'+names.map(row).join('')+'</div>'}
  const inLib=new Set(LIB.flatMap(g=>g[1])),rec=[];
  for(const ses of S.sessions){for(const e of ses.exercises)if(!rec.includes(e.name))rec.push(e.name);if(rec.length>=6)break}
  const others=all.filter(n=>!inLib.has(n)).sort((a,b)=>a.localeCompare(b,'fr'));
  let h='';
  if(rec.length)h+='<div class="sec">Récents</div><div class="list">'+rec.slice(0,6).map(row).join('')+'</div>';
  LIB.forEach(([g,names])=>{h+='<div class="sec" style="margin-top:16px">'+g+'</div><div class="list">'+names.map(row).join('')+'</div>'});
  if(others.length)h+='<div class="sec" style="margin-top:16px">Mes exercices</div><div class="list">'+others.map(row).join('')+'</div>';
  return h;
}

function pushEx(name){
  if(routEdit&&!(S.active&&gymOpen)){const r=curRoutine();if(r){r.exercises.push({name,sets:3,kg:'',reps:''});persist('routines')}closeSheet();render();return}
  S.active.exercises.push({name,sets:mkSets(3)});persist('active');closeSheet();render();
  setTimeout(()=>{const cs=document.querySelectorAll('.ex');if(cs.length)cs[cs.length-1].scrollIntoView({behavior:'smooth',block:'center'})},60);
}
A['g-pickex']=b=>pushEx(b.dataset.name);

A['g-finish']=()=>{
  const a=S.active,done=a.exercises.reduce((t,e)=>t+e.sets.filter(s=>s.done).length,0),skip=a.exercises.reduce((t,e)=>t+e.sets.filter(s=>!s.done).length,0);
  if(!done){toast('Coche au moins une série');return}
  confirmSheet('Terminer la séance ?',done+' série'+(done>1?'s':'')+' validée'+(done>1?'s':'')+(skip?'. '+skip+' non cochée'+(skip>1?'s':'')+' ne seront pas gardées.':'.'),'Terminer',finishSession);
};
function finishSession(){
  const a=S.active;
  const exs=a.exercises.map(e=>({name:e.name,sets:e.sets.filter(s=>s.done).map(s=>({kg:num(s.kg),reps:num(s.reps)}))})).filter(e=>e.sets.length);
  const date=ymd(new Date(a.start)),prevBest={};
  exs.forEach(e=>{const h=history(e.name);prevBest[e.name]=h.reduce((m,x)=>Math.max(m,num(x.top.kg)),0)});
  const ses={id:a.id,date,name:a.name||'Séance',dur:Math.max(1,Math.round((Date.now()-a.start)/60000)),exercises:exs};
  S.sessions.unshift(ses);S.sessions.sort((x,y)=>y.date.localeCompare(x.date));
  S.active=null;restEnd=0;gymOpen=false;persist('sessions',date);persist('active');
  const recs=exs.filter(e=>{const t=topSet(e.sets);return prevBest[e.name]>0&&num(t.kg)>prevBest[e.name]}).map(e=>{const t=topSet(e.sets);return e.name+' : '+nf(num(t.kg),2)+' kg × '+nf(num(t.reps),0)});

function progressView(){
  const names=[...new Set(S.sessions.flatMap(s=>s.exercises.map(e=>e.name)))];
  if(!names.length)return '<div class="card empty">Termine une séance pour voir l’évolution de tes charges, exercice par exercice.</div>';
  const rows=names.map(n=>{const h=history(n);return{n,h,last:h[h.length-1]}}).sort((a,b)=>b.last.date.localeCompare(a.last.date));
  if(!progEx||!names.includes(progEx))progEx=rows[0].n;
  const cur=rows.find(r=>r.n===progEx),h=cur.h;
  const val=p=>progMetric==='top'?num(p.top.kg):progMetric==='e1'?p.e1:p.vol;
  const unit='kg';
  const best=h.reduce((b,p)=>!b||num(p.top.kg)>num(b.top.kg)?p:b,null),bestE=h.reduce((m,p)=>Math.max(m,p.e1),0);
  const list=rows.map(r=>{
    const l=r.h[r.h.length-1],pv=r.h[r.h.length-2],dl=pv?num(l.top.kg)-num(pv.top.kg):null;
    return `<button class="li" data-act="g-prog" data-n="${esc(r.n)}" ${r.n===progEx?'style="font-weight:700"':''}>${thumb(r.n,44)}<div class="grow"><div class="t">${esc(r.n)}</div><div class="small muted">${nf(num(l.top.kg),2)} kg × ${nf(num(l.top.reps),0)} · ${r.h.length} séance${r.h.length>1?'s':''}</div></div>${dl==null?'<span class="small muted">1re fois</span>':`<span class="num delta ${dl>0?'up':dl<0?'down':''}" style="font-weight:800">${dl>0?'▲ +':dl<0?'▼ −':'= '}${dl===0?'':nf(Math.abs(dl),2)}</span>`}</button>`;
  }).join('');
  return `<div class="card"><div class="row sb" style="margin-bottom:10px"><h2 style="margin:0">${esc(progEx)}</h2></div>
  <div class="seg"><button data-act="g-metric" data-m="top" aria-selected="${progMetric==='top'}">Charge max</button><button data-act="g-metric" data-m="e1" aria-selected="${progMetric==='e1'}">1RM estimé</button><button data-act="g-metric" data-m="vol" aria-selected="${progMetric==='vol'}">Volume</button></div>
  <div class="readout" id="gread"></div><div class="chartbox" id="gchart"></div>
  <div class="stats" style="margin-top:12px;grid-template-columns:1fr 1fr"><div class="stat"><span>Record de charge</span><b>${nf(num(best.top.kg),2)}</b><span>kg × ${nf(num(best.top.reps),0)}</span></div><div class="stat"><span>1RM estimé max</span><b>${nf(bestE,1)}</b><span>kg (formule d’Epley)</span></div></div></div>
  <div class="card"><h2>Mes exercices</h2><div class="list">${list}</div><div class="small muted" style="margin-top:8px">La flèche compare ta charge max à la séance précédente.</div></div>`;
}

let restTotal=0,restBarState='',restRang=false;
const mmss=s=>Math.floor(s/60)+':'+pad(s%60);
function startRest(sec){restTotal=sec;restEnd=Date.now()+sec*1000;restRang=false;syncRestBar()}
function syncRestBar(){
  let el=$('#rbar');
  const want=(tab==='gym'&&gymOpen&&S.active)?(restEnd>Date.now()?'on':'idle'):'';
  if(!want){if(el)el.remove();restBarState='';return}
  if(!el||restBarState!==want){
    if(el)el.remove();
    el=document.createElement('div');el.id='rbar';el.className='rbar'+(want==='on'?' on':'');
    el.innerHTML=want==='on'
      ?`<i id="rfill"></i><button class="rmain" data-act="g-rest-less" aria-label="Enlever 15 secondes">−15</button>
        <button class="rclock" data-act="g-rest-dur" aria-label="Changer la durée du repos"><span class="small" style="opacity:.75;font-weight:700">REPOS</span><b id="rclk">0:00</b></button>
        <button class="rmain" data-act="g-rest-more" aria-label="Ajouter 15 secondes">+15</button>
        <button class="rmain" data-act="g-rest-skip">Passer</button>`
      :`<button class="rgo" data-act="g-rest-go">⏱ Démarrer le repos</button>
        <button class="rdur" data-act="g-rest-dur" aria-label="Changer la durée du repos"><span id="rdef">${mmss(S.settings.rest)}</span> ▾</button>`;
    document.body.appendChild(el);restBarState=want;
  }
  if(want==='on'){
    const ms=restEnd-Date.now(),left=Math.ceil(ms/1000);
    if(left<=0){
      if(!restRang){restRang=true;toast('Repos terminé');try{navigator.vibrate&&navigator.vibrate([200,90,200])}catch(_){}}
      restEnd=0;syncRestBar();return;
    }
    const c=$('#rclk');if(c)c.textContent=mmss(left);
    const f=$('#rfill');if(f&&restTotal)f.style.width=clamp(ms/(restTotal*1000)*100,0,100)+'%';
  }else{const d=$('#rdef');if(d)d.textContent=mmss(S.settings.rest)}
}
